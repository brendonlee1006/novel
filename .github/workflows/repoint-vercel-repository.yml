name: Repoint formal Vercel Git repository

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Repoint the formal project to the new repository, or explicitly restore the fixed source after an unlinked failure
        required: true
        type: choice
        options:
          - repoint-to-personal-repository
          - restore-source-linkage
      control_commit:
        description: Exact 40-character main commit containing this workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-vercel-git-repository-migration
  cancel-in-progress: false

jobs:
  repoint_vercel_git_repository:
    name: repoint formal Vercel Git repository
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'brendonlee1006/novel' &&
      github.repository_id == '1357493987' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.control_commit &&
      github.workflow_sha == github.sha &&
      (inputs.operation == 'repoint-to-personal-repository' || inputs.operation == 'restore-source-linkage')
    runs-on: ubuntu-latest
    environment: production-migration
    timeout-minutes: 10
    steps:
      - name: Checkout exact migration control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact target repository and disabled native deployments
        shell: bash
        env:
          CONTROL_COMMIT: ${{ inputs.control_commit }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY_ID: ${{ github.repository_id }}
          TARGET_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          case "$REQUESTED_OPERATION" in
            repoint-to-personal-repository|restore-source-linkage) ;;
            *) exit 1 ;;
          esac
          test "$CONTROL_COMMIT" = "$GITHUB_SHA"
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$TARGET_REPOSITORY" = brendonlee1006/novel
          test "$TARGET_REPOSITORY_ID" = 1357493987
          test "$TARGET_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'const value = require("./vercel.json"); if (value?.git?.deploymentEnabled !== false) process.exit(1)'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned migration dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify fail-closed relink contract
        shell: bash
        run: node scripts/run-vercel-git-repository-relink-tests.mjs

      - name: Read-only Vercel linkage preflight
        if: inputs.operation == 'repoint-to-personal-repository'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: lqtechs-projects
        run: node scripts/repoint-vercel-git-repository.mjs --dry-run

      - name: Repoint and verify only the Vercel Git linkage
        if: inputs.operation == 'repoint-to-personal-repository'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: lqtechs-projects
        run: node scripts/repoint-vercel-git-repository.mjs --apply

      - name: Restore fixed source linkage only from a verified unlinked state
        if: inputs.operation == 'restore-source-linkage'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: lqtechs-projects
        run: node scripts/repoint-vercel-git-repository.mjs --restore-source
