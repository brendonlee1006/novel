name: Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Trusted Preview bootstrap/deploy/read-only diagnosis, one-time repository-migration LKG bootstrap, read-only LKG audit, historical RC6.2 recovery HOLD, or Production rollback operation
        required: true
        type: choice
        options:
          - bootstrap-trusted-preview-env
          - diagnose-trusted-preview-env
          - deploy-preview
          - audit-last-known-good
          - audit-rc6-2-last-known-good
          - bootstrap-lkg-repository-migration
          - deploy-immutable-product-recovery
          - restore-known-stable
      preview_ref:
        description: Exact 40-character commit SHA from this repository (trusted Preview bootstrap/deploy or audit-last-known-good)
        required: false
        type: string
      consumer_run_id:
        description: Existing target-repository push/main workflow run ID authorized to consume the one-time migration seed (bootstrap-lkg-repository-migration only)
        required: false
        type: string
      consumer_commit:
        description: Exact 40-character target-repository commit for the authorized consumer run (bootstrap-lkg-repository-migration only)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'restore-known-stable' || inputs.operation == 'deploy-immutable-product-recovery'))) && 'vercel-production-main') || ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'bootstrap-trusted-preview-env' || inputs.operation == 'diagnose-trusted-preview-env' || inputs.operation == 'deploy-preview')) && 'vercel-trusted-attestation-preview') || ((github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-lkg-repository-migration') && 'production-lkg-repository-migration-bootstrap') || ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'audit-last-known-good' || inputs.operation == 'audit-rc6-2-last-known-good')) && format('vercel-lkg-audit-{0}', inputs.preview_ref || github.sha)) || format('vercel-preview-{0}', github.event.pull_request.number || inputs.preview_ref || github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'bootstrap-trusted-preview-env' || inputs.operation == 'diagnose-trusted-preview-env' || inputs.operation == 'deploy-preview' || inputs.operation == 'bootstrap-lkg-repository-migration' || inputs.operation == 'restore-known-stable' || inputs.operation == 'audit-last-known-good' || inputs.operation == 'audit-rc6-2-last-known-good' || inputs.operation == 'deploy-immutable-product-recovery'))) }}

env:
  RECOVERY_PRODUCT_COMMIT: 29fc6e742672bb07187765d34ea818afdadf56ae
  RC6_2_RECOVERY_EXACT_CONTROL_COMMIT: 9cd074f239b73dd9b61f6d758fcf97fbd809face
  PRODUCT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && '29fc6e742672bb07187765d34ea818afdadf56ae' || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview' && inputs.preview_ref || github.sha }}
  CONTROL_COMMIT: ${{ github.sha }}
  VERCEL_GIT_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && '29fc6e742672bb07187765d34ea818afdadf56ae' || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview' && inputs.preview_ref || github.sha }}
  PRIMARY_ALIAS: novel-orcin.vercel.app
  MIRROR_ALIAS: novel-lqtechs-projects.vercel.app
  VERCEL_SCOPE: lqtechs-projects
  LEGACY_BOOTSTRAP_DEPLOYMENT_ID: dpl_8vdPA2mFkDJUezr5Rfn5MuxqJuBa
  LEGACY_BOOTSTRAP_COMMIT: d0e80323dc68bf08cb541e46c6b9114a71e05cd9
  EMERGENCY_RECOVERY_DEPLOYMENT_ID: dpl_ECbrLCX4RsdhUUjYj7cZrhY27oJV
  EMERGENCY_RECOVERY_COMMIT: 5cf5e819a95d9f98d485a2bec1c39ae68c1d4a1f
  RC6_2_LKG_APP_COMMIT: 29fc6e742672bb07187765d34ea818afdadf56ae
  RC6_2_LKG_PRIMARY_DEPLOYMENT_ID: dpl_8pqTpwAgQQAqmLKNzZNCzSfPuqNn
  RC6_2_LKG_MIRROR_DEPLOYMENT_ID: dpl_8pqTpwAgQQAqmLKNzZNCzSfPuqNn
  RC6_2_LKG_RELEASE_TAG: novel-ai-p24b-conversation-first-studio-rc6.2
  RC6_2_LKG_RELEASE_REVISION: rc6.2
  RC6_2_LKG_ARTIFACT_ID: '9114871493'
  RC6_2_LKG_ARTIFACT_NAME: production-last-known-good-control-9cd074f239b73dd9b61f6d758fcf97fbd809face-product-29fc6e742672bb07187765d34ea818afdadf56ae
  RC6_2_LKG_ARTIFACT_DIGEST: sha256:b08153dd5ae5b908a1b972799746a1a2621cb2a33bf90025853fa1688f941a5b
  RC6_2_LKG_RUN_ID: '31524952520'
  RC6_2_LKG_CONTROL_COMMIT: 9cd074f239b73dd9b61f6d758fcf97fbd809face
  HISTORICAL_RC6_1_LKG_APP_COMMIT: e84972aaec80885f9e2ab58e56252fb7b93522ea
  HISTORICAL_RC6_1_LKG_DEPLOYMENT_ID: dpl_EHemQJyNZtn1NS69tnxQ24dKBRN3
  HISTORICAL_RC6_1_LKG_RELEASE_TAG: novel-ai-p24b-conversation-first-studio-rc6
  HISTORICAL_RC6_1_LKG_RELEASE_REVISION: rc6.1

jobs:
  validate:
    name: validate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      recovery_control_proof_digest: ${{ steps.recovery_control.outputs.proof_digest }}
      release_line: ${{ steps.validated_release_identity.outputs.release_line }}
      release_tag: ${{ steps.validated_release_identity.outputs.release_tag }}
      release_revision: ${{ steps.validated_release_identity.outputs.release_revision }}
      release_name: ${{ steps.validated_release_identity.outputs.release_name }}
      consumer_release: ${{ steps.validated_release_identity.outputs.consumer_release }}
      architecture_stage: ${{ steps.validated_release_identity.outputs.architecture_stage }}
      provenance_hash: ${{ steps.validated_release_identity.outputs.provenance_hash }}
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview' && inputs.preview_ref || github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && '29fc6e742672bb07187765d34ea818afdadf56ae' || github.sha }}
    steps:
      - name: Checkout trusted recovery control commit
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify exact dual-SHA recovery control commit
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        id: recovery_control
        shell: bash
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.RECOVERY_PRODUCT_COMMIT }}
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_CONTROL_PROOF_PATH: ${{ runner.temp }}/rc6-evidence/production-recovery-control-proof.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc6-evidence"
          node scripts/verify-production-recovery-control.mjs
          node scripts/run-production-recovery-control-tests.mjs
          node scripts/run-pr23-r21-workflow-contract.mjs
          node scripts/run-rc6-4-release-workflow-contract.mjs
          node scripts/verify-rc6-4-production-diagnostics-seam.mjs self-test
          node scripts/run-production-main-head-cas-tests.mjs
          cp scripts/verify-github-release-attestation.mjs "$RUNNER_TEMP/verify-github-release-attestation.mjs"
          proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RECOVERY_CONTROL_PROOF_PATH")"
          echo "proof_digest=$proof_digest" >> "$GITHUB_OUTPUT"

      - name: Install locked recovery-control test dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Verify dual-SHA runtime-closure contract from the control commit
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        run: |
          node scripts/generate-release-provenance.mjs
          node scripts/run-rc6-1-deployment-governance.mjs all
          node --import ./scripts/register-rc6-test-loader.mjs scripts/run-rc6-2-runtime-closure.mjs

      - name: Checkout exact Product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.VERCEL_GIT_COMMIT_SHA }}
          persist-credentials: false

      - name: Enforce exact Product checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VERCEL_GIT_COMMIT_SHA"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Chromium for browser gates
        run: pnpm exec playwright install --with-deps chromium

      - name: Install locked WebKit for current mobile browser gates
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'deploy-immutable-product-recovery'
        run: pnpm exec playwright install --with-deps webkit

      - name: Initialize ephemeral CI evidence
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/rc6-evidence"

      - name: Prepare validation-only demand-loaded Worker asset
        run: pnpm build:manual-learning-worker

      - name: Seal exact-SHA validation release provenance
        run: node scripts/generate-release-provenance.mjs

      - name: Validate and export Product-owned release identity
        id: validated_release_identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { verifyReleaseProvenance } from "./scripts/generate-release-provenance.mjs";

          const manifest = JSON.parse(readFileSync("release-manifest.json", "utf8"));
          const contract = JSON.parse(readFileSync("release-metadata-contract.json", "utf8"));
          const provenance = JSON.parse(readFileSync("generated/release-provenance.json", "utf8"));
          const fields = [
            ["releaseLine", "release_line", "EXPECTED_RELEASE_LINE"],
            ["releaseTag", "release_tag", "EXPECTED_RELEASE_TAG"],
            ["releaseRevision", "release_revision", "EXPECTED_RELEASE_REVISION"],
            ["releaseName", "release_name", "EXPECTED_RELEASE_NAME"],
            ["consumerRelease", "consumer_release", "EXPECTED_CONSUMER_RELEASE"],
            ["architectureStage", "architecture_stage", "EXPECTED_ARCHITECTURE_STAGE"],
          ];
          if (!verifyReleaseProvenance(provenance)
            || provenance.appCommit !== process.env.VERCEL_GIT_COMMIT_SHA
            || provenance.releaseProductCommit !== process.env.PRODUCT_COMMIT) {
            throw new Error("VALIDATED_RELEASE_PROVENANCE_IDENTITY_MISMATCH");
          }
          for (const [manifestKey, outputKey, environmentKey] of fields) {
            const value = String(manifest[manifestKey] ?? "");
            if (!value || /[\r\n]/u.test(value)
              || value !== contract.immutableReleaseIdentity?.[manifestKey]
              || value !== provenance[manifestKey]) {
              throw new Error(`VALIDATED_RELEASE_IDENTITY_MISMATCH:${manifestKey}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${outputKey}=${value}\n`, "utf8");
            appendFileSync(process.env.GITHUB_ENV, `${environmentKey}=${value}\n`, "utf8");
          }
          const provenanceHash = String(provenance.integrity?.payloadHash ?? "");
          if (!/^[0-9a-f]{64}$/u.test(provenanceHash)) {
            throw new Error("VALIDATED_RELEASE_PROVENANCE_HASH_INVALID");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `provenance_hash=${provenanceHash}\n`, "utf8");
          NODE

      - name: Verify immutable release policy and exact Product SHA
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.VERCEL_GIT_COMMIT_SHA }}
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/rc6-evidence/immutable-release-tag-proof.json
        run: node scripts/verify-immutable-release-tag.mjs policy

      - name: Verify immutable recovery release tag and GitHub Release
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASE_REQUIRE_REPOSITORY_SETTING: 'false'
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/rc6-evidence/immutable-release-tag-proof.json
        run: node scripts/verify-immutable-release-tag.mjs remote

      - name: Bind recovery GitHub Release database identity from immutable tag proof
        id: release_database_identity
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        shell: bash
        run: |
          set -euo pipefail
          release_database_id="$(jq -er '.immutableReleaseId | tostring | select(test("^[1-9][0-9]{0,19}$"))' "$RUNNER_TEMP/rc6-evidence/immutable-release-tag-proof.json")"
          test "$(jq -r '.releaseTag' "$RUNNER_TEMP/rc6-evidence/immutable-release-tag-proof.json")" = "$EXPECTED_RELEASE_TAG"
          test "$(jq -r '.productCommit' "$RUNNER_TEMP/rc6-evidence/immutable-release-tag-proof.json")" = "$PRODUCT_COMMIT"
          echo "release_database_id=$release_database_id" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_RELEASE_DATABASE_ID=$release_database_id" >> "$GITHUB_ENV"

      - name: Verify recovery GitHub-signed immutable Release attestation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/rc6-evidence/immutable-release-tag-proof.json
          RELEASE_ATTESTATION_PROOF_PATH: ${{ runner.temp }}/rc6-evidence/github-release-attestation-proof.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.operation }}" == "deploy-immutable-product-recovery" ]]; then
            node "$RUNNER_TEMP/verify-github-release-attestation.mjs"
          else
            node scripts/verify-github-release-attestation.mjs
          fi

      - name: Authorize exact normal main Product from event SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCT_COMMIT" = "$GITHUB_SHA"
          test "$CONTROL_COMMIT" = "$GITHUB_SHA"
          test "$VERCEL_GIT_COMMIT_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"

      - name: Authorize exact peeled immutable recovery Product
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        shell: bash
        run: |
          set -euo pipefail
          peeled_commit="$(jq -er '.peeledCommit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/rc6-evidence/immutable-release-tag-proof.json")"
          attested_commit="$(jq -er '.productCommit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/rc6-evidence/github-release-attestation-proof.json")"
          test "$peeled_commit" = "$PRODUCT_COMMIT"
          test "$attested_commit" = "$PRODUCT_COMMIT"
          test "$PRODUCT_COMMIT" = "$RECOVERY_PRODUCT_COMMIT"
          test "$CONTROL_COMMIT" = "$RC6_2_RECOVERY_EXACT_CONTROL_COMMIT"

      - name: Verify RC6 release hardening
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ci:rc6-release-hardening 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/release-hardening.log"

      - name: Verify RC6.4 release workflow and diagnostics isolation contracts
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'deploy-immutable-product-recovery'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-rc6-4-release-workflow-contract.mjs
          node scripts/run-main-push-auto-deploy-workflow-contract.mjs all
          node scripts/generate-rc6-4-static-asset-manifest.mjs self-test
          node scripts/generate-rc6-4-production-static-network-manifest.mjs self-test
          node scripts/verify-rc6-4-production-diagnostics-seam.mjs self-test
          node scripts/bootstrap-trusted-preview-env.mjs --self-test
          node scripts/verify-preview-supabase-isolation.mjs --self-test
          pnpm test:ai:browser:setup-state-machine-rc6.4
          pnpm test:ai:browser:setup-runtime-rc6.4
          pnpm test:ai:browser:setup-diagnostics-rc6.4
          pnpm test:ai:browser:prose-candidate-v2-rc6.5
          pnpm test:ai:browser:prose-candidate-v2-runtime-rc6.5

      - name: Run RC6 conversation-first gates
        run: |
          set -euo pipefail
          {
            pnpm test:studio:conversation-first-contract
            pnpm test:studio:conversation-first-browser
            pnpm test:studio:conversation-mobile
            pnpm test:mobile:workspace-contract
            pnpm test:studio:conversation-persistence
            pnpm test:studio:conversation-backup
            pnpm test:studio:conversation-branching
            pnpm test:studio:conversation-approval
            pnpm test:studio:conversation-rpg
            pnpm test:studio:conversation-execution-trace
            pnpm test:studio:rpg-library-dashboard-ui
            pnpm test:studio:chat-detailed-dashboard
            pnpm test:ai:conversation-project-memory
            pnpm test:ai:conversation-tool-routing
            pnpm test:ai:conversation-security
            pnpm test:ai:manual-learning-file-contract
            pnpm test:ai:manual-learning-import-transaction
            pnpm test:ai:manual-learning-worker
            pnpm test:ai:manual-learning-global-synthesis
            pnpm test:ai:controlled-web-distillation
            pnpm test:ai:shared-learning-library
            pnpm test:ai:public-story-research-seed
            pnpm test:ai:mode-choice-curriculum
            pnpm test:ai:procedural-story-library
            pnpm test:studio:topic-world-contract
            pnpm test:studio:story-topic-audit
            pnpm test:studio:global-world-index
            pnpm test:studio:global-world-rule-workspace
            pnpm test:studio:global-canon
            pnpm test:studio:global-character-index
            pnpm test:studio:character-mastery
            pnpm test:studio:social-matrix
            pnpm test:studio:selected-story-bible
            pnpm test:studio:global-canon-social-assets
            pnpm test:ai:topic-world-family-stage-matrix
            pnpm test:ai:topic-world-family-rpg-bridge
            pnpm test:ai:rules-story-fallback-variety
            pnpm test:ai:rules-story-arc-closure
            pnpm test:studio:rpg-first-turn-playability
            pnpm test:studio:create-story-seed-ai
            pnpm test:studio:project-playmode-clone
            pnpm test:studio:project-context-navigation
            pnpm test:ai:author-tools
            pnpm test:studio:organization-hierarchy
            pnpm test:studio:procedural-treasure-library
            pnpm test:studio:character-staging
            pnpm test:studio:story-selection-boundary
            node --experimental-strip-types --import ./scripts/register-ts-extension-loader.mjs scripts/run-conversation-rpg-dashboard-presentation.mjs
          } 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/conversation-gates.log"

      - name: Run required product suites
        run: |
          set -euo pipefail
          {
            pnpm test:ai:p24b:all
            pnpm test:ai:p24b-rc3-1-regeneration
            pnpm test:ai:closed:unified-os
            pnpm test:ai:closed:web-operability
            pnpm test:ai:closed:optimization
            pnpm test:ai:external:modes
            pnpm test:ai:external:request-guard
            pnpm test:ai:external:health-hardening
            pnpm test:ai:conversation-external-wiring
            pnpm test:media:seedance-contract
            pnpm test:media:video-worker-contract
            pnpm test:ai:closed:cloud-sync
            pnpm test:ai:whole-novel-review
            pnpm test:public-lounge
            pnpm test:ai:closed:model-verification-timeout
            pnpm test:ai:closed:super-agent-rpg
            pnpm test:ai:closed:cache-runtime
            pnpm test:ai:closed:controlled-learning-runtime
            pnpm test:ai:closed-ai-runtime-r2
            pnpm test:p12
            pnpm test:studio:chapter-isolation
            pnpm test:studio:writing-flow
            pnpm test:studio:task-session-rpg-ai
            pnpm test:studio:rpg-fallback-quality
            node --experimental-strip-types --import ./scripts/register-ts-extension-loader.mjs scripts/run-browser-compute-plane-rc5.mjs studio-automatic-closed-compute-coordinator
            pnpm test:studio:rpg-adult-runtime-production-seam
            pnpm test:studio:rpg-normal-os-validation
            pnpm test:ai:rpg-external-cascade
            pnpm test:studio:rpg-v3-all
            pnpm test:ai:p15:consumer-platform
            pnpm test:ai:p21:three-high
          } 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/product-regressions.log"

      - name: Run PR23 R2.1 truth gates
        run: |
          set -euo pipefail
          {
            pnpm test:ai:indexeddb-blocked-byte-preservation
            pnpm test:ai:indexeddb-blocked-ui-write-gate
            pnpm test:ai:daily-backup-marker-after-success
            pnpm test:ai:quick-assistant-canonical-approval
            pnpm test:ai:actual-executor-truth
            pnpm test:ai:legacy-health-cannot-claim-closed-runtime
            pnpm test:ci:dual-alias-rollback
            pnpm test:ci:workflow-contract
            pnpm test:ci:rc6-1-deployment-governance
          } 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/truth-gates.log"

      - name: Run RC6.5 release and retained compatibility closure gates
        env:
          RC6_2_START_SERVER: '1'
          RC6_2_BASE_URL: http://127.0.0.1:3136
        run: |
          set -euo pipefail
          {
            pnpm test:ci:release-revision
            pnpm test:ci:release-tag-commit-traceability
            pnpm test:ci:artifact-attestation
            pnpm test:ci:build-provenance
            pnpm test:ci:signature-vs-provenance-truth
            pnpm test:ci:production-main-head-cas
            pnpm test:ai:closed-ai-runtime-rc6-2
            pnpm test:ai:rc6.2:persistence-contract
            pnpm test:ai:rc6.2:persistence-browser
            pnpm test:studio:conversation-component-contract
            pnpm test:studio:conversation-lazy-tools
            pnpm test:studio:conversation-long-session
            pnpm test:studio:conversation-scroll-restoration
            pnpm test:ai:manual-learning-worker-asset
            pnpm test:ai:attachment-worker-cancellation
            pnpm test:ai:attachment-worker-memory-release
            pnpm test:ai:attachment-late-result-rejected
          } 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/rc6-2-hardening.log"

      - name: Verify secrets, Companion ZIP, and evidence schemas
        run: |
          set -euo pipefail
          {
            pnpm test:ai:p24b:secret-scan
            pnpm test:ci:companion-zip-content
            pnpm test:ci:evidence-schema
            pnpm test:ci:production-supabase-bootstrap
            pnpm test:ci:production-external-ai-bootstrap
          } 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/security-and-evidence.log"

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/typecheck.log"

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint:ci 2>&1 | tee "$RUNNER_TEMP/rc6-evidence/lint.log"

      - name: Write exact-SHA evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rc6-evidence"
          jq -n \
            --arg schemaVersion "p24b-rc6-actions-evidence-v1" \
            --arg headSha "$VERCEL_GIT_COMMIT_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobStatus "${{ job.status }}" \
            '{schemaVersion:$schemaVersion,headSha:$headSha,ref:$ref,runId:$runId,runAttempt:$runAttempt,jobStatus:$jobStatus,rawUploadsIncluded:false}' \
            > "$RUNNER_TEMP/rc6-evidence/manifest.json"

      - name: Upload RC6 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p24b-rc6-validation-${{ env.VERCEL_GIT_COMMIT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc6-evidence
          if-no-files-found: error
          retention-days: 30

  # Control-plane prerequisite: create `trusted-preview`, restrict it to the
  # exact feature branch, and add its seven PREVIEW_* secrets before dispatch.
  # A missing/unapproved Environment intentionally keeps this job fail-closed.
  bootstrap_trusted_preview_env:
    name: bootstrap trusted Preview environment
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'bootstrap-trusted-preview-env' &&
      github.ref_type == 'branch' &&
      github.ref == 'refs/heads/trusted-attestation-producer' &&
      github.sha == inputs.preview_ref &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    environment: trusted-preview
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted Preview bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.preview_ref }}
          persist-credentials: false

      - name: Enforce exact trusted Preview bootstrap authority
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REF_TYPE: ${{ github.ref_type }}
          EXPECTED_PREVIEW_REF: ${{ inputs.preview_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PREVIEW_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_REF" == "refs/heads/trusted-attestation-producer" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_PREVIEW_REF" ]]
          [[ "$EXPECTED_EVENT_SHA" == "$EXPECTED_PREVIEW_REF" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_PREVIEW_REF" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == *"$EXPECTED_REPOSITORY"* ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked Preview environment tooling
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Verify trusted Preview bootstrap implementation
        run: node scripts/bootstrap-trusted-preview-env.mjs --self-test

      - name: Bootstrap exact branch-scoped trusted Preview environment
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
          PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID }}
        run: |
          set -euo pipefail
          node scripts/bootstrap-trusted-preview-env.mjs --required

      - name: Remove any local Vercel environment material
        if: always()
        shell: bash
        run: rm -f .vercel/.env.preview.local .vercel/.env.production.local

  bootstrap_trusted_preview_env_complete:
    name: bootstrap trusted Preview environment complete
    needs: bootstrap_trusted_preview_env
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'bootstrap-trusted-preview-env'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful trusted Preview bootstrap
        shell: bash
        env:
          BOOTSTRAP_RESULT: ${{ needs.bootstrap_trusted_preview_env.result }}
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP_RESULT" != "success" ]]; then
            echo "::error title=Trusted Preview bootstrap rejected::Exact feature-branch authority, configuration validation, write, or metadata verification failed."
            exit 1
          fi
          echo "::notice title=Trusted Preview bootstrap complete::Branch-scoped Preview metadata was verified without exporting secret values."

  diagnose_trusted_preview_env:
    name: diagnose trusted Preview environment read-only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'diagnose-trusted-preview-env' &&
      github.ref_type == 'branch' &&
      github.ref == 'refs/heads/trusted-attestation-producer' &&
      github.sha == inputs.preview_ref &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    environment: trusted-preview
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted Preview diagnosis head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.preview_ref }}
          persist-credentials: false

      - name: Enforce exact read-only diagnosis authority
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REF_TYPE: ${{ github.ref_type }}
          EXPECTED_PREVIEW_REF: ${{ inputs.preview_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PREVIEW_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_REF" == "refs/heads/trusted-attestation-producer" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_PREVIEW_REF" ]]
          [[ "$EXPECTED_EVENT_SHA" == "$EXPECTED_PREVIEW_REF" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_PREVIEW_REF" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == *"$EXPECTED_REPOSITORY"* ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify read-only diagnosis and disclosure boundaries
        run: node scripts/run-trusted-preview-environment-diagnostics-tests.mjs

      - name: Diagnose trusted Preview metadata using Vercel GET only
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/bootstrap-trusted-preview-env.mjs --diagnose-only

  preview:
    name: preview
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy-preview' &&
      github.ref_type == 'branch' &&
      github.ref == 'refs/heads/trusted-attestation-producer' &&
      github.sha == inputs.preview_ref &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    environment: trusted-preview
    timeout-minutes: 45
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ inputs.preview_ref }}
      VERCEL_GIT_COMMIT_REF: trusted-attestation-producer
      NEXT_PUBLIC_RC6_4_BROWSER_PROSE_DIAGNOSTICS: '1'
      EXPECTED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      EXPECTED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
      EXPECTED_RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      EXPECTED_CONSUMER_RELEASE: ${{ needs.validate.outputs.consumer_release }}
      EXPECTED_ARCHITECTURE_STAGE: ${{ needs.validate.outputs.architecture_stage }}
    steps:
      - name: Checkout trusted Preview head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERCEL_GIT_COMMIT_SHA }}
          persist-credentials: false

      - name: Enforce trusted exact-SHA Preview policy
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$VERCEL_GIT_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_REF_TYPE" == "branch" ]]
          [[ "$GITHUB_REF" == "refs/heads/trusted-attestation-producer" ]]
          [[ "$GITHUB_REF_NAME" == "$VERCEL_GIT_COMMIT_REF" ]]
          [[ "$GITHUB_SHA" == "$VERCEL_GIT_COMMIT_SHA" ]]
          [[ "$EXPECTED_EVENT_SHA" == "$VERCEL_GIT_COMMIT_SHA" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$VERCEL_GIT_COMMIT_SHA" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == *"$EXPECTED_REPOSITORY"* ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install Preview deployment tooling
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment (Production isolation reference)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=production --scope="$VERCEL_SCOPE"

      - name: Pull Vercel environment (Preview)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=preview --git-branch="$VERCEL_GIT_COMMIT_REF" --scope="$VERCEL_SCOPE"

      - name: Verify exact branch-scoped Preview environment metadata
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
          PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID }}
        run: |
          set -euo pipefail
          node scripts/bootstrap-trusted-preview-env.mjs --verify-only

      - name: Verify isolated Preview Supabase and v5 verifier configuration
        id: preview_isolation
        shell: bash
        env:
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ secrets.PREVIEW_SUPABASE_ANON_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
          PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_ED25519_PUBLIC_KEY }}
          PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID: ${{ secrets.PREVIEW_PUBLIC_LOUNGE_ELIGIBILITY_KEY_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-preview-supabase-isolation.mjs --github-preview-secrets-required

      - name: Provision and verify isolated Preview Public Lounge storage
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/provision-public-lounge-storage.mjs --required --env-file .vercel/.env.preview.local

      - name: Apply and verify isolated Preview Public Lounge migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.preview_isolation.outputs.preview_project_ref }}
        run: |
          set -euo pipefail
          apply_and_verify() {
            local migration_script="$1"
            local migration_name="${migration_script##*/}"
            set +e
            node "$migration_script" --check --required >/dev/null 2>&1
            local precheck_status=$?
            set -e
            if [[ "$precheck_status" -ne 0 && "$precheck_status" -ne 3 ]]; then
              echo "::error title=Preview migration precheck failed::$migration_name exited with status $precheck_status"
              exit 1
            fi
            set +e
            node "$migration_script" --required >/dev/null 2>&1
            local apply_status=$?
            set -e
            if [[ "$apply_status" -ne 0 ]]; then
              echo "::error title=Preview migration apply failed::$migration_name exited with status $apply_status"
              exit 1
            fi
            set +e
            node "$migration_script" --check --required >/dev/null 2>&1
            local verify_status=$?
            set -e
            if [[ "$verify_status" -ne 0 ]]; then
              echo "::error title=Preview migration verification failed::$migration_name exited with status $verify_status"
              exit 1
            fi
            echo "::notice title=Preview migration verified::$migration_name"
          }
          apply_and_verify scripts/apply-public-lounge-interactions-migration.mjs
          apply_and_verify scripts/apply-public-lounge-control-plane-migration.mjs
          apply_and_verify scripts/apply-public-lounge-attestation-ledger-migration.mjs

      - name: Build Preview
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_RC6_4_BROWSER_PROSE_DIAGNOSTICS" = 1
          pnpm exec vercel build --scope="$VERCEL_SCOPE"

      - name: Seal exact RC6.4 Preview static asset manifest
        shell: bash
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.VERCEL_GIT_COMMIT_SHA }}
          RC6_4_PRODUCT_COMMIT: ${{ env.VERCEL_GIT_COMMIT_SHA }}
          RC6_4_STATIC_ASSET_ROOT: .vercel/output/static
          RC6_4_STATIC_ASSET_MANIFEST_PATH: ${{ github.workspace }}/.vercel/rc6.4-preview-static-assets.json
          RC6_4_STATIC_ASSET_SIDECAR_PATH: ${{ github.workspace }}/.vercel/rc6.4-preview-static-assets.sha256
        run: |
          set -euo pipefail
          node --import ./scripts/register-rc6-test-loader.mjs scripts/run-rc6-4-browser-prose-diagnostic-bridge.mjs
          node scripts/verify-rc6-4-production-diagnostics-seam.mjs preview .vercel/output/static \
            > .vercel/rc6.4-preview-diagnostic-bridge-bytes.json
          node scripts/generate-rc6-4-static-asset-manifest.mjs generate
          node scripts/generate-rc6-4-static-asset-manifest.mjs validate

      - name: Upload exact RC6.4 Preview static asset evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc6-4-preview-static-assets-${{ env.VERCEL_GIT_COMMIT_SHA }}-${{ github.run_attempt }}
          path: |
            .vercel/rc6.4-preview-static-assets.json
            .vercel/rc6.4-preview-static-assets.sha256
            .vercel/rc6.4-preview-diagnostic-bridge-bytes.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy isolated Preview
        id: preview
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          output="$(pnpm exec vercel deploy --prebuilt --yes --scope="$VERCEL_SCOPE" 2>&1)"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' <<<"$output" | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "::notice title=RC6 Preview URL::$deployment_url"

      - name: Verify Preview release identity
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_COMMIT: ${{ env.VERCEL_GIT_COMMIT_SHA }}
        run: |
          set -euo pipefail
          identity_probe="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$identity_probe" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          identity_url="$PREVIEW_URL/api/release/identity?rc6_4_prose_diagnostics=$identity_probe"
          for attempt in {1..15}; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$identity_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              release_product_commit="$(jq -r '.releaseProductCommit // empty' <<<"$body")"
              environment="$(jq -r '.environment // empty' <<<"$body")"
              provenance_status="$(jq -r '.provenanceStatus // empty' <<<"$body")"
              release_line="$(jq -r '.releaseLine // empty' <<<"$body")"
              release_tag="$(jq -r '.releaseTag // empty' <<<"$body")"
              release_revision="$(jq -r '.releaseRevision // empty' <<<"$body")"
              release_name="$(jq -r '.releaseName // empty' <<<"$body")"
              consumer_release="$(jq -r '.consumerRelease // empty' <<<"$body")"
              architecture_stage="$(jq -r '.architectureStage // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              if [[ "$app_commit" == "$EXPECTED_COMMIT" && "$release_product_commit" == "$EXPECTED_COMMIT" && "$environment" == "preview" && "$provenance_status" == "verified" && "$release_line" == "$EXPECTED_RELEASE_LINE" && "$release_tag" == "$EXPECTED_RELEASE_TAG" && "$release_revision" == "$EXPECTED_RELEASE_REVISION" && "$release_name" == "$EXPECTED_RELEASE_NAME" && "$consumer_release" == "$EXPECTED_CONSUMER_RELEASE" && "$architecture_stage" == "$EXPECTED_ARCHITECTURE_STAGE" && -n "$deployment_id" ]]; then
                printf '### RC6.4 Preview\n\n- URL: %s\n- Commit: `%s`\n- Release identity: verified\n- Static manifest: exact\n- Browser prose diagnostics: enabled\n' "$PREVIEW_URL" "$EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Preview release identity did not match trusted branch head $EXPECTED_COMMIT." >&2
          exit 1

      - name: Remove local Vercel environment material
        if: always()
        shell: bash
        run: rm -f .vercel/.env.preview.local .vercel/.env.production.local

  historical_rc6_2_recovery_hold:
    name: historical RC6.2 immutable recovery HOLD
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'deploy-immutable-product-recovery' &&
      github.sha != '9cd074f239b73dd9b61f6d758fcf97fbd809face'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse stale historical recovery topology
        shell: bash
        run: |
          echo "HOLD: RC6.2 recovery is preserved only as read-only prior provenance; a current-main dispatch is not authorized." >&2
          exit 1

  bootstrap_lkg_repository_migration:
    name: bootstrap one-time repository-migration LKG seed
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'brendonlee1006/novel' &&
      github.repository_id == '1357493987' &&
      inputs.operation == 'bootstrap-lkg-repository-migration'
    runs-on: ubuntu-latest
    environment: production-migration
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact trusted migration-bootstrap control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact target and one existing authorized consumer run
        shell: bash
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          MIGRATION_CONSUMER_RUN_ID: ${{ inputs.consumer_run_id }}
          MIGRATION_CONSUMER_COMMIT: ${{ inputs.consumer_commit }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY_ID: ${{ github.repository_id }}
          TARGET_REF: ${{ github.ref }}
          TARGET_CONTROL_COMMIT: ${{ github.sha }}
          BOOTSTRAP_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$DISPATCH_OPERATION" = bootstrap-lkg-repository-migration
          test "$TARGET_REPOSITORY" = brendonlee1006/novel
          test "$TARGET_REPOSITORY_ID" = 1357493987
          test "$TARGET_REF" = refs/heads/main
          [[ "$TARGET_CONTROL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MIGRATION_CONSUMER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MIGRATION_CONSUMER_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$MIGRATION_CONSUMER_RUN_ID" != "$BOOTSTRAP_RUN_ID"
          test "$(git rev-parse HEAD)" = "$TARGET_CONTROL_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Preflight target artifacts then verify source and write one-time seed
        id: bootstrap_source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_LKG_READ_TOKEN: ${{ secrets.SOURCE_LKG_READ_TOKEN }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          MIGRATION_CONSUMER_RUN_ID: ${{ inputs.consumer_run_id }}
          MIGRATION_CONSUMER_COMMIT: ${{ inputs.consumer_commit }}
          TARGET_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_LKG_IDENTITY_PATH: ${{ runner.temp }}/source-last-known-good-production.json
          SOURCE_LKG_PROOF_PATH: ${{ runner.temp }}/source-last-known-good-artifact-proof.json
          MIGRATION_SEED_PATH: ${{ runner.temp }}/last-known-good-production.json
          MIGRATION_SELECTION_PROOF_PATH: ${{ runner.temp }}/repository-migration-selection-proof.json
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_FETCH_TIMEOUT_MS: 10000
          ROLLBACK_TARGET_SELECTION_DEADLINE_MS: 60000
        run: node scripts/production-last-known-good.mjs bootstrap-source

      - name: Capture inherited formal aliases without mutation
        id: bootstrap_aliases
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ALIAS_CAPTURE_DEADLINE_MS: 60000
          VERCEL_FETCH_TIMEOUT_MS: 10000
        run: node scripts/vercel-dual-alias-cutover.mjs capture

      - name: Require fail-closed one-time seed publication truth
        shell: bash
        env:
          MIGRATION_CONSUMER_RUN_ID: ${{ inputs.consumer_run_id }}
          PUBLICATION_MODE: ${{ steps.bootstrap_source.outputs.publication_mode }}
          SEED_ELIGIBLE: ${{ steps.bootstrap_source.outputs.seed_eligible }}
          SEED_NAME: ${{ steps.bootstrap_source.outputs.seed_name }}
          PRODUCT_COMMIT: ${{ steps.bootstrap_source.outputs.product_commit }}
          SOURCE_DEPLOYMENT_ID: ${{ steps.bootstrap_source.outputs.source_deployment_id }}
          OUTPUT_CONSUMER_RUN_ID: ${{ steps.bootstrap_source.outputs.consumer_run_id }}
          SEED_PROVENANCE_DIGEST: ${{ steps.bootstrap_source.outputs.seed_provenance_digest }}
          PRIMARY_ALIAS_DEPLOYMENT_ID: ${{ steps.bootstrap_aliases.outputs.primary_deployment_id }}
          PRIMARY_ALIAS_COMMIT: ${{ steps.bootstrap_aliases.outputs.primary_app_commit }}
          MIRROR_ALIAS_DEPLOYMENT_ID: ${{ steps.bootstrap_aliases.outputs.mirror_deployment_id }}
          MIRROR_ALIAS_COMMIT: ${{ steps.bootstrap_aliases.outputs.mirror_app_commit }}
        run: |
          set -euo pipefail
          test "$PUBLICATION_MODE" = repository-migration-seed
          test "$SEED_ELIGIBLE" = true
          test "$OUTPUT_CONSUMER_RUN_ID" = "$MIGRATION_CONSUMER_RUN_ID"
          [[ "$PRODUCT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$SEED_PROVENANCE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$PRIMARY_ALIAS_DEPLOYMENT_ID" = "$SOURCE_DEPLOYMENT_ID"
          test "$PRIMARY_ALIAS_COMMIT" = "$PRODUCT_COMMIT"
          test "$MIRROR_ALIAS_DEPLOYMENT_ID" = "$SOURCE_DEPLOYMENT_ID"
          test "$MIRROR_ALIAS_COMMIT" = "$PRODUCT_COMMIT"
          expected_seed_name="production-last-known-good-migration-control-${GITHUB_SHA}-consumer-${MIGRATION_CONSUMER_RUN_ID}-product-${PRODUCT_COMMIT}"
          test "$SEED_NAME" = "$expected_seed_name"
          test "$(basename "$RUNNER_TEMP/last-known-good-production.json")" = last-known-good-production.json
          test -s "$RUNNER_TEMP/source-last-known-good-production.json"
          test -s "$RUNNER_TEMP/source-last-known-good-artifact-proof.json"
          test -s "$RUNNER_TEMP/last-known-good-production.json"
          test -s "$RUNNER_TEMP/repository-migration-selection-proof.json"

      - name: Upload one-time repository-migration LKG seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bootstrap_source.outputs.seed_name }}
          path: ${{ runner.temp }}/last-known-good-production.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  audit_last_known_good:
    name: audit last known good read only
    needs: validate
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery' && needs.validate.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'audit-last-known-good' || inputs.operation == 'audit-rc6-2-last-known-good')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_FETCH_TIMEOUT_MS: 10000
      ROLLBACK_TARGET_SELECTION_DEADLINE_MS: 60000
      AUDIT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-last-known-good' && inputs.preview_ref || github.sha }}
    steps:
      - name: Require the explicit audit commit to equal this trusted workflow head
        shell: bash
        env:
          EXPECTED_EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$AUDIT_COMMIT" == "$EXPECTED_EVENT_COMMIT" ]]

      - name: Checkout exact read-only audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 11
          persist-credentials: false

      - name: Enforce exact read-only LKG audit policy
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$AUDIT_COMMIT" ]]
          remote="$(git remote get-url origin)"
          [[ "$remote" == *"$EXPECTED_REPOSITORY"* ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prove exact read-only RC6.2 browser-gate control lineage
        id: browser_gate_control
        if: inputs.operation == 'audit-rc6-2-last-known-good'
        env:
          EXPECTED_OPERATION: audit-rc6-2-last-known-good
          BROWSER_GATE_CONTROL_PROOF_PATH: ${{ runner.temp }}/rc6-2-browser-gate-control-proof.json
        run: node scripts/run-rc6-2-production-browser-gate-contract.mjs write-audit-control-proof

      - name: Validate exact C10 read-only audit control proof
        if: inputs.operation == 'audit-rc6-2-last-known-good'
        env:
          BROWSER_GATE_CONTROL_PROOF_PATH: ${{ runner.temp }}/rc6-2-browser-gate-control-proof.json
        run: node scripts/run-pr23-r21-workflow-contract.mjs validate-audit-control-proof

      - name: Discover prior Last Known Good artifact
        id: lkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: node scripts/production-last-known-good.mjs discover

      - name: Require prior Last Known Good availability
        shell: bash
        run: test "${{ steps.lkg.outputs.available }}" = true

      - name: Require exact RC6.2 prior rollback artifact only for recovery or historical audit
        if: inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lkg.outputs.artifact_id }}" = "$RC6_2_LKG_ARTIFACT_ID"
          test "${{ steps.lkg.outputs.artifact_name }}" = "$RC6_2_LKG_ARTIFACT_NAME"
          test "${{ steps.lkg.outputs.artifact_digest }}" = "$RC6_2_LKG_ARTIFACT_DIGEST"
          test "${{ steps.lkg.outputs.run_id }}" = "$RC6_2_LKG_RUN_ID"
          test "${{ steps.lkg.outputs.product_commit }}" = "$RC6_2_LKG_APP_COMMIT"
          test "${{ steps.lkg.outputs.control_commit }}" = "$RC6_2_LKG_CONTROL_COMMIT"

      - name: Require cryptographic dynamic Last Known Good metadata for normal main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.lkg.outputs.artifact_id }}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${{ steps.lkg.outputs.artifact_name }}" =~ ^production-last-known-good-[a-z0-9-]+$ ]]
          [[ "${{ steps.lkg.outputs.artifact_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${{ steps.lkg.outputs.run_id }}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${{ steps.lkg.outputs.product_commit }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ steps.lkg.outputs.control_commit }}" =~ ^[a-f0-9]{40}$ ]]
          test "${{ steps.lkg.outputs.workflow_branch }}" = main

      - name: Require explicit normal-main LKG publication mode
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          LKG_PUBLICATION_MODE: ${{ steps.lkg.outputs.publication_mode }}
          LKG_SEED_ELIGIBLE: ${{ steps.lkg.outputs.seed_eligible }}
          LKG_ARTIFACT_NAME: ${{ steps.lkg.outputs.artifact_name }}
          LKG_PRODUCT_COMMIT: ${{ steps.lkg.outputs.product_commit }}
          LKG_CONTROL_COMMIT: ${{ steps.lkg.outputs.control_commit }}
        run: |
          set -euo pipefail
          case "$LKG_PUBLICATION_MODE:$LKG_SEED_ELIGIBLE" in
            same-sha:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-${LKG_PRODUCT_COMMIT}"
              ;;
            immutable-product-control:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-control-${LKG_CONTROL_COMMIT}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            repository-migration-seed:true)
              test "$GITHUB_REPOSITORY" = brendonlee1006/novel
              test "$GITHUB_REPOSITORY_ID" = 1357493987
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-migration-control-${LKG_CONTROL_COMMIT}-consumer-${GITHUB_RUN_ID}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            *)
              echo "Refusing Last Known Good with an unsupported publication-mode/seed-eligibility pair." >&2
              exit 1
              ;;
          esac

      - name: Download and verify prior Last Known Good identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          LAST_KNOWN_GOOD_ARTIFACT_ID: ${{ steps.lkg.outputs.artifact_id }}
          LAST_KNOWN_GOOD_ARTIFACT_NAME: ${{ steps.lkg.outputs.artifact_name }}
          LAST_KNOWN_GOOD_ARTIFACT_DIGEST: ${{ steps.lkg.outputs.artifact_digest }}
          LAST_KNOWN_GOOD_RUN_ID: ${{ steps.lkg.outputs.run_id }}
          LAST_KNOWN_GOOD_HEAD_SHA: ${{ steps.lkg.outputs.head_sha }}
          LAST_KNOWN_GOOD_PRODUCT_COMMIT: ${{ steps.lkg.outputs.product_commit }}
          LAST_KNOWN_GOOD_CONTROL_COMMIT: ${{ steps.lkg.outputs.control_commit }}
          LAST_KNOWN_GOOD_WORKFLOW_EVENT: ${{ steps.lkg.outputs.workflow_event }}
          LAST_KNOWN_GOOD_WORKFLOW_BRANCH: ${{ steps.lkg.outputs.workflow_branch }}
          LAST_KNOWN_GOOD_RUN_ATTEMPT: ${{ steps.lkg.outputs.run_attempt }}
          LAST_KNOWN_GOOD_WORKFLOW_PATH: ${{ steps.lkg.outputs.workflow_path }}
          LAST_KNOWN_GOOD_CREATED_AT: ${{ steps.lkg.outputs.created_at }}
          LAST_KNOWN_GOOD_PUBLICATION_MODE: ${{ steps.lkg.outputs.publication_mode }}
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_LKG_APP_COMMIT: ${{ (inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good') && env.RC6_2_LKG_APP_COMMIT || '' }}
          EXPECTED_LKG_PRIMARY_DEPLOYMENT_ID: ${{ (inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good') && env.RC6_2_LKG_PRIMARY_DEPLOYMENT_ID || '' }}
          EXPECTED_LKG_MIRROR_DEPLOYMENT_ID: ${{ (inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good') && env.RC6_2_LKG_MIRROR_DEPLOYMENT_ID || '' }}
          EXPECTED_LKG_RELEASE_TAG: ${{ (inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good') && env.RC6_2_LKG_RELEASE_TAG || '' }}
          EXPECTED_LKG_RELEASE_REVISION: ${{ (inputs.operation == 'deploy-immutable-product-recovery' || inputs.operation == 'audit-rc6-2-last-known-good') && env.RC6_2_LKG_RELEASE_REVISION || '' }}
        run: node scripts/production-last-known-good.mjs download

      - name: Prove prior Last Known Good control-plane selection without mutation
        id: lkg_selection
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REQUIRE_AUDIT_SELECTION_PROVENANCE: 'true'
          AUDIT_PRODUCT_COMMIT: ${{ inputs.operation == 'deploy-immutable-product-recovery' && env.PRODUCT_COMMIT || inputs.operation == 'audit-rc6-2-last-known-good' && env.RECOVERY_PRODUCT_COMMIT || env.AUDIT_COMMIT }}
          AUDIT_CONTROL_PROOF_DIGEST: ${{ inputs.operation == 'deploy-immutable-product-recovery' && needs.validate.outputs.recovery_control_proof_digest || inputs.operation == 'audit-rc6-2-last-known-good' && steps.browser_gate_control.outputs.proof_digest || '' }}
          DISABLE_CURRENT_CAPTURE: 'true'
          LAST_KNOWN_GOOD_AVAILABLE: 'true'
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          ROLLBACK_SELECTION_PROOF_PATH: ${{ runner.temp }}/lkg-readonly-selection-proof.json
        run: node scripts/production-last-known-good.mjs select

      - name: Require exact read-only selection truth
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lkg_selection.outputs.source }}" = last-known-good
          if [[ "${{ inputs.operation }}" == "deploy-immutable-product-recovery" || "${{ inputs.operation }}" == "audit-rc6-2-last-known-good" ]]; then
            test "${{ steps.lkg_selection.outputs.primary_app_commit }}" = "$RC6_2_LKG_APP_COMMIT"
            test "${{ steps.lkg_selection.outputs.mirror_app_commit }}" = "$RC6_2_LKG_APP_COMMIT"
            test "${{ steps.lkg_selection.outputs.primary_deployment_id }}" = "$RC6_2_LKG_PRIMARY_DEPLOYMENT_ID"
            test "${{ steps.lkg_selection.outputs.mirror_deployment_id }}" = "$RC6_2_LKG_MIRROR_DEPLOYMENT_ID"
          else
            [[ "${{ steps.lkg_selection.outputs.primary_app_commit }}" =~ ^[a-f0-9]{40}$ ]]
            test "${{ steps.lkg_selection.outputs.primary_app_commit }}" = "${{ steps.lkg_selection.outputs.mirror_app_commit }}"
            [[ "${{ steps.lkg_selection.outputs.primary_deployment_id }}" =~ ^dpl_[A-Za-z0-9]+$ ]]
            test "${{ steps.lkg_selection.outputs.primary_deployment_id }}" = "${{ steps.lkg_selection.outputs.mirror_deployment_id }}"
          fi

      - name: Upload sanitized read-only LKG audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.operation == 'audit-rc6-2-last-known-good' && format('production-lkg-readonly-audit-rc62-{0}-{1}-{2}-{3}-{4}', steps.lkg_selection.outputs.primary_app_commit, steps.lkg_selection.outputs.primary_deployment_id, steps.browser_gate_control.outputs.proof_digest, steps.lkg_selection.outputs.selection_proof_digest, github.run_id) || format('production-lkg-readonly-audit-current-{0}-{1}', env.AUDIT_COMMIT, github.run_id) }}
          path: |
            ${{ runner.temp }}/last-known-good-production.json
            ${{ runner.temp }}/last-known-good-artifact-proof.json
            ${{ runner.temp }}/lkg-readonly-selection-proof.json
            ${{ runner.temp }}/rc6-2-browser-gate-control-proof.json
          if-no-files-found: error
          retention-days: 30

  production_env_audit:
    name: production-env-audit
    needs: [validate, audit_last_known_good]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repair_required: ${{ steps.audit.outputs.repair_required }}
      mutation_count: ${{ steps.audit.outputs.mutation_count }}
      before_digest: ${{ steps.audit.outputs.before_digest }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_FALLBACK: iwobncchxuykcztziavw
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL_ID: grok-4.5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install read-only Production audit tooling
        run: pnpm install --frozen-lockfile

      - name: Audit Production environment without mutation
        id: audit
        env:
          PRODUCTION_ENV_AUDIT_PATH: ${{ runner.temp }}/production-environment-audit.json
        run: node scripts/production-environment-governance.mjs audit

      - name: Upload sanitized Production environment audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-environment-audit-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-environment-audit.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  production_env_repair:
    name: production-env-repair
    needs: [validate, production_env_audit]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mutation_count: ${{ steps.repair.outputs.mutation_count || steps.noop_receipt.outputs.mutation_count }}
      before_digest: ${{ steps.repair.outputs.before_digest || steps.noop_receipt.outputs.before_digest }}
      after_digest: ${{ steps.repair.outputs.after_digest || steps.noop_receipt.outputs.after_digest }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_FALLBACK: iwobncchxuykcztziavw
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL_ID: grok-4.5
    steps:
      - name: Checkout validated Product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Download exact sanitized Production audit evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: production-environment-audit-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-environment-audit

      - name: Install Production repair tooling
        run: pnpm install --frozen-lockfile

      - name: Refuse stale Product commit before shared learning schema mutation
        if: github.event_name == 'push'
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Apply and verify additive shared abstract learning schema
        if: github.event_name == 'push'
        run: node scripts/apply-shared-learning-migration.mjs --required

      - name: Refuse stale Product commit immediately before Production environment mutation
        if: needs.production_env_audit.outputs.repair_required == 'true'
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Repair Production environment only when audit found drift
        id: repair
        if: needs.production_env_audit.outputs.repair_required == 'true'
        env:
          PRODUCTION_MAIN_HEAD_CAS_REQUIRED: 'true'
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
          AUDIT_REPAIR_REQUIRED: ${{ needs.production_env_audit.outputs.repair_required }}
          AUDIT_BEFORE_DIGEST: ${{ needs.production_env_audit.outputs.before_digest }}
          PRODUCTION_ENV_AUDIT_INPUT_PATH: ${{ runner.temp }}/production-environment-audit/production-environment-audit.json
          PRODUCTION_ENV_REPAIR_RECEIPT_PATH: ${{ runner.temp }}/production-environment-repair-receipt.json
        run: node scripts/production-environment-governance.mjs repair

      - name: Record zero-mutation repair receipt when audit is already ready
        id: noop_receipt
        if: needs.production_env_audit.outputs.repair_required != 'true'
        env:
          AUDIT_REPAIR_REQUIRED: ${{ needs.production_env_audit.outputs.repair_required }}
          AUDIT_BEFORE_DIGEST: ${{ needs.production_env_audit.outputs.before_digest }}
          PRODUCTION_ENV_AUDIT_INPUT_PATH: ${{ runner.temp }}/production-environment-audit/production-environment-audit.json
          PRODUCTION_ENV_REPAIR_RECEIPT_PATH: ${{ runner.temp }}/production-environment-repair-receipt.json
        run: node scripts/production-environment-governance.mjs repair

      - name: Upload sanitized Production repair receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-environment-repair-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-environment-repair-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Production Public Lounge runtime fail closed
        if: github.event_name == 'push'
        env:
          PRODUCTION_MAIN_HEAD_CAS_REQUIRED: 'true'
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
          PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY: ${{ secrets.PUBLIC_LOUNGE_IDEMPOTENCY_ENCRYPTION_KEY }}
          PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY: ${{ secrets.PUBLIC_LOUNGE_RATE_IDENTITY_HMAC_KEY }}
          PUBLIC_LOUNGE_RUNTIME_PREPARATION_RECEIPT_PATH: ${{ runner.temp }}/public-lounge-runtime-preparation.json
        run: node scripts/prepare-public-lounge-runtime-production.mjs --required

      - name: Apply Public Lounge interactions schema
        if: github.event_name == 'push'
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify-production-main-head-cas.mjs
          node scripts/apply-public-lounge-interactions-migration.mjs --required

      - name: Verify Public Lounge interactions schema
        if: github.event_name == 'push'
        run: node scripts/apply-public-lounge-interactions-migration.mjs --check --required

      - name: Apply and verify Public Lounge catalog and quota control plane
        if: github.event_name == 'push'
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify-production-main-head-cas.mjs
          node scripts/apply-public-lounge-control-plane-migration.mjs --required

      - name: Apply and verify Public Lounge v5 attestation nonce ledger
        if: github.event_name == 'push'
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: |
          node scripts/verify-production-main-head-cas.mjs
          node scripts/apply-public-lounge-attestation-ledger-migration.mjs --required

      - name: Upload sanitized Public Lounge runtime preparation receipt
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-lounge-runtime-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-lounge-runtime-preparation.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  restore_known_stable:
    name: restore known stable production aliases
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore-known-stable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_FETCH_TIMEOUT_MS: 10000
      ROLLBACK_TARGET_SELECTION_DEADLINE_MS: 60000
      ROLLBACK_DEADLINE_MS: 240000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce exact restore control checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$CONTROL_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Discover latest successful Last Known Good artifact
        id: lkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production-last-known-good.mjs discover

      - name: Require the latest successful Last Known Good artifact
        shell: bash
        run: test "${{ steps.lkg.outputs.available }}" = true

      - name: Download latest Last Known Good identity
        if: steps.lkg.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAST_KNOWN_GOOD_ARTIFACT_ID: ${{ steps.lkg.outputs.artifact_id }}
          LAST_KNOWN_GOOD_ARTIFACT_NAME: ${{ steps.lkg.outputs.artifact_name }}
          LAST_KNOWN_GOOD_ARTIFACT_DIGEST: ${{ steps.lkg.outputs.artifact_digest }}
          LAST_KNOWN_GOOD_RUN_ID: ${{ steps.lkg.outputs.run_id }}
          LAST_KNOWN_GOOD_HEAD_SHA: ${{ steps.lkg.outputs.head_sha }}
          LAST_KNOWN_GOOD_PRODUCT_COMMIT: ${{ steps.lkg.outputs.product_commit }}
          LAST_KNOWN_GOOD_CONTROL_COMMIT: ${{ steps.lkg.outputs.control_commit }}
          LAST_KNOWN_GOOD_WORKFLOW_EVENT: ${{ steps.lkg.outputs.workflow_event }}
          LAST_KNOWN_GOOD_WORKFLOW_BRANCH: ${{ steps.lkg.outputs.workflow_branch }}
          LAST_KNOWN_GOOD_RUN_ATTEMPT: ${{ steps.lkg.outputs.run_attempt }}
          LAST_KNOWN_GOOD_WORKFLOW_PATH: ${{ steps.lkg.outputs.workflow_path }}
          LAST_KNOWN_GOOD_CREATED_AT: ${{ steps.lkg.outputs.created_at }}
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          EXPECTED_LKG_APP_COMMIT: ''
          EXPECTED_LKG_PRIMARY_DEPLOYMENT_ID: ''
          EXPECTED_LKG_MIRROR_DEPLOYMENT_ID: ''
          EXPECTED_LKG_RELEASE_TAG: ''
          EXPECTED_LKG_RELEASE_REVISION: ''
        run: node scripts/production-last-known-good.mjs download

      - name: Prove latest Last Known Good selection independently
        if: steps.lkg.outputs.available == 'true'
        id: lkg_live_selection
        env:
          DISABLE_CURRENT_CAPTURE: 'true'
          LAST_KNOWN_GOOD_AVAILABLE: 'true'
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          ROLLBACK_SELECTION_PROOF_PATH: ${{ runner.temp }}/lkg-independent-selection-proof.json
        run: node scripts/production-last-known-good.mjs select

      - name: Require independent Last Known Good selection proof
        if: steps.lkg.outputs.available == 'true'
        shell: bash
        run: test "${{ steps.lkg_live_selection.outputs.source }}" = last-known-good

      - name: Select verified Last Known Good or emergency fallback
        id: rollback
        env:
          DISABLE_CURRENT_CAPTURE: 'true'
          LAST_KNOWN_GOOD_AVAILABLE: ${{ steps.lkg.outputs.available }}
          LAST_KNOWN_GOOD_PATH: ${{ steps.lkg.outputs.available == 'true' && format('{0}/last-known-good-production.json', runner.temp) || '' }}
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ steps.lkg.outputs.available == 'true' && format('{0}/last-known-good-artifact-proof.json', runner.temp) || '' }}
          EMERGENCY_PRIMARY_DEPLOYMENT: ${{ env.EMERGENCY_RECOVERY_DEPLOYMENT_ID }}
          EMERGENCY_PRIMARY_COMMIT: ${{ env.EMERGENCY_RECOVERY_COMMIT }}
          EMERGENCY_MIRROR_DEPLOYMENT: ${{ env.EMERGENCY_RECOVERY_DEPLOYMENT_ID }}
          EMERGENCY_MIRROR_COMMIT: ${{ env.EMERGENCY_RECOVERY_COMMIT }}
        run: node scripts/production-last-known-good.mjs select

      - name: Restore and verify both production aliases
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: |
          node scripts/verify-production-main-head-cas.mjs
          node scripts/vercel-dual-alias-cutover.mjs restore

  production_build:
    name: build
    needs: [validate, production_env_repair]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_started_at: ${{ steps.production_build_window.outputs.build_started_at }}
      build_completed_at: ${{ steps.production_build_window.outputs.build_completed_at }}
      archive_sha256: ${{ steps.preupload_secret_scan.outputs.archive_sha256 }}
      preupload_scan_receipt_digest: ${{ steps.preupload_secret_scan.outputs.receipt_digest }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_RC6_4_BROWSER_PROSE_DIAGNOSTICS: '0'
      EXPECTED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      EXPECTED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
      EXPECTED_RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      EXPECTED_CONSUMER_RELEASE: ${{ needs.validate.outputs.consumer_release }}
      EXPECTED_ARCHITECTURE_STAGE: ${{ needs.validate.outputs.architecture_stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false

      - name: Enforce immutable Product build checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment (production)
        run: pnpm exec vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Verify RC6.4 Production diagnostics source contract
        if: github.event_name == 'push'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_RC6_4_BROWSER_PROSE_DIAGNOSTICS" = 0
          test "$PRODUCT_COMMIT" = "$GITHUB_SHA"
          test "$CONTROL_COMMIT" = "$GITHUB_SHA"
          test "$VERCEL_GIT_COMMIT_SHA" = "$GITHUB_SHA"
          node scripts/verify-rc6-4-production-diagnostics-seam.mjs source

      - name: Provision and verify encrypted cloud sync private storage
        run: node scripts/provision-cloud-sync-storage.mjs --env-file .vercel/.env.production.local --required

      - name: Provision and verify public lounge private storage
        run: node scripts/provision-public-lounge-storage.mjs --env-file .vercel/.env.production.local --required

      - name: Build production and record the actual build window
        id: production_build_window
        shell: bash
        run: |
          set -euo pipefail
          build_started_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          export NOVEL_BUILD_STARTED_AT="$build_started_at"
          pnpm exec vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          build_completed_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          node -e 'const [s,c]=process.argv.slice(1).map(Date.parse); if(!Number.isFinite(s)||!Number.isFinite(c)||s>c) process.exit(1)' "$build_started_at" "$build_completed_at"
          echo "build_started_at=$build_started_at" >> "$GITHUB_OUTPUT"
          echo "build_completed_at=$build_completed_at" >> "$GITHUB_OUTPUT"

      - name: Verify Conversation production bundle budget
        run: pnpm test:studio:conversation-bundle-budget

      - name: Verify complete prebuilt Production file references
        run: node scripts/verify-vercel-prebuilt-file-references.mjs

      - name: Verify RC6.4 diagnostics seam is absent from sealed Production bytes
        if: github.event_name == 'push'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-rc6-4-production-diagnostics-seam.mjs sealed .vercel/output/static .next/static \
            > "$RUNNER_TEMP/rc6-4-production-diagnostics-seam.json"
          test "$(jq -r '.status' "$RUNNER_TEMP/rc6-4-production-diagnostics-seam.json")" = PASS
          test "$(jq -r '.productCommit' "$RUNNER_TEMP/rc6-4-production-diagnostics-seam.json")" = "$PRODUCT_COMMIT"

      - name: Seal complete prebuilt Production filesystem
        shell: bash
        run: |
          set -euo pipefail
          test -d .next
          tar --create --gzip \
            --file "$RUNNER_TEMP/production-prebuilt.tgz" \
            --exclude='.next/cache' \
            .vercel/output .next \
            public/generated/manual-learning-worker.js \
            release-manifest.json release-metadata-contract.json \
            generated/release-provenance.json

      - name: Scan sealed Production bytes before immutable artifact upload
        id: preupload_secret_scan
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/production-prebuilt-preupload-secret-scan.json"
          node scripts/scan-sealed-production-artifact.mjs \
            --root .vercel/output \
            --root .next \
            --root public/generated/manual-learning-worker.js \
            --root release-manifest.json \
            --root release-metadata-contract.json \
            --root generated/release-provenance.json \
            --env-file .vercel/.env.production.local \
            --archive "$RUNNER_TEMP/production-prebuilt.tgz" \
            --report "$receipt"
          archive_sha256="$(jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' "$receipt")"
          receipt_digest="$(jq -er '.receiptDigest | select(test("^[0-9a-f]{64}$"))' "$receipt")"
          test "$(jq -r '.status' "$receipt")" = PASS
          test "$(jq -r '.trueCredentialHits' "$receipt")" = 0
          test "$(jq -r '.clientCredentialHits' "$receipt")" = 0
          test "$(jq -r '.sourceMapCredentialHits' "$receipt")" = 0
          test "$(jq -r '.workerCredentialHits' "$receipt")" = 0
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "receipt_digest=$receipt_digest" >> "$GITHUB_OUTPUT"

      - name: Upload sealed prebuilt Production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-prebuilt-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-prebuilt.tgz
            ${{ runner.temp }}/production-prebuilt-preupload-secret-scan.json
            ${{ github.event_name == 'push' && format('{0}/rc6-4-production-diagnostics-seam.json', runner.temp) || '' }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  post_build_secret_scan:
    name: post-build sealed artifact secret scan
    needs: production_build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      receipt_digest: ${{ steps.immutable_secret_scan.outputs.receipt_digest }}
    steps:
      - name: Checkout exact Product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false

      - name: Enforce immutable Product scan checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download immutable prebuilt Production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: production-prebuilt-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-prebuilt-scan

      - name: Independently rescan downloaded sealed bytes
        id: immutable_secret_scan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/production-prebuilt-scan/production-prebuilt.tgz"
          prior="$RUNNER_TEMP/production-prebuilt-scan/production-prebuilt-preupload-secret-scan.json"
          receipt="$RUNNER_TEMP/production-prebuilt-post-build-secret-scan.json"
          node scripts/scan-sealed-production-artifact.mjs \
            --archive "$archive" \
            --expected-digest "${{ needs.production_build.outputs.archive_sha256 }}" \
            --prior-receipt "$prior" \
            --report "$receipt"
          test "$(jq -r '.status' "$receipt")" = PASS
          test "$(jq -r '.trueCredentialHits' "$receipt")" = 0
          test "$(jq -r '.clientCredentialHits' "$receipt")" = 0
          test "$(jq -r '.sourceMapCredentialHits' "$receipt")" = 0
          test "$(jq -r '.workerCredentialHits' "$receipt")" = 0
          test "$(jq -r '.archiveSha256' "$receipt")" = "${{ needs.production_build.outputs.archive_sha256 }}"
          receipt_digest="$(jq -er '.receiptDigest | select(test("^[0-9a-f]{64}$"))' "$receipt")"
          echo "receipt_digest=$receipt_digest" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized immutable secret scan receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-build-secret-scan-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-prebuilt-post-build-secret-scan.json
          if-no-files-found: error
          retention-days: 30

  staged_deploy:
    name: staged deploy
    needs: [validate, production_build, post_build_secret_scan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.production.outputs.url }}
      deployed_at: ${{ steps.production.outputs.deployed_at }}
      deployment_id: ${{ steps.production_static_identity.outputs.deployment_id }}
      build_started_at: ${{ needs.production_build.outputs.build_started_at }}
      build_completed_at: ${{ needs.production_build.outputs.build_completed_at }}
      archive_sha256: ${{ needs.production_build.outputs.archive_sha256 }}
      post_build_scan_receipt_digest: ${{ needs.post_build_secret_scan.outputs.receipt_digest }}
      production_static_manifest_digest: ${{ steps.production_static_manifest.outputs.manifest_digest }}
      production_static_manifest_file_digest: ${{ steps.production_static_manifest.outputs.manifest_file_digest }}
      production_static_asset_domain_digest: ${{ steps.production_static_manifest.outputs.asset_domain_digest }}
      production_static_artifact_id: ${{ steps.production_static_upload.outputs.artifact-id }}
      production_static_artifact_digest: ${{ steps.production_static_upload.outputs.artifact-digest }}
      production_deploy_command_count: ${{ steps.production_authority.outputs.production_deploy_command_count }}
      production_deployment_authority: ${{ steps.production_control_plane.outputs.production_deployment_authority }}
      production_deployment_match_count: ${{ steps.production_control_plane.outputs.production_deployment_match_count }}
      duplicate_production_deploy_count: ${{ steps.production_control_plane.outputs.duplicate_production_deploy_count }}
      production_authority_receipt_digest: ${{ steps.production_control_plane.outputs.receipt_digest }}
      production_authority_artifact_id: ${{ steps.production_authority_upload.outputs.artifact-id }}
      production_authority_artifact_digest: ${{ steps.production_authority_upload.outputs.artifact-digest }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EXPECTED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      EXPECTED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
      EXPECTED_RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      EXPECTED_CONSUMER_RELEASE: ${{ needs.validate.outputs.consumer_release }}
      EXPECTED_ARCHITECTURE_STAGE: ${{ needs.validate.outputs.architecture_stage }}
    steps:
      - name: Checkout exact Product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          persist-credentials: false

      - name: Checkout trusted Production control commit for staged-deploy CAS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      - name: Enforce dual-SHA staged-deploy checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C .release-control rev-parse HEAD)" = "$CONTROL_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$CONTROL_COMMIT"

      - name: Verify single GitHub Actions Production deployment authority
        id: production_authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const workflow = readFileSync(".release-control/.github/workflows/deploy.yml", "utf8");
          const productVercel = JSON.parse(readFileSync("vercel.json", "utf8"));
          const controlVercel = JSON.parse(readFileSync(".release-control/vercel.json", "utf8"));
          const exactCommands = workflow.match(/^\s*\{\s*pnpm exec vercel deploy --prebuilt --prod --skip-domain\b/gmu) ?? [];
          const allProductionCommands = workflow.match(/^\s*(?:\{\s*)?pnpm exec vercel deploy\b[^\r\n]*--prod\b/gmu) ?? [];
          if (productVercel.git?.deploymentEnabled !== false
            || controlVercel.git?.deploymentEnabled !== false
            || exactCommands.length !== 1
            || allProductionCommands.length !== 1) {
            throw new Error("PRODUCTION_DEPLOYMENT_AUTHORITY_NOT_SINGLE");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "production_deploy_command_count=1\n", "utf8");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install locked deployment tooling
        run: pnpm install --frozen-lockfile

      - name: Restore sealed prebuilt Production artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: production-prebuilt-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-prebuilt

      - name: Extract sealed prebuilt Production filesystem
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/production-prebuilt/production-prebuilt.tgz"
          test -f "$archive"
          actual_digest="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_digest" = "${{ needs.production_build.outputs.archive_sha256 }}"
          tar --extract --gzip --file "$archive" --directory "$GITHUB_WORKSPACE"

      - name: Verify restored Build Output API artifact
        shell: bash
        run: test -f .vercel/output/config.json

      - name: Pull Vercel project identity for staged deployment
        run: pnpm exec vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Verify sealed artifact after Vercel project pull
        run: node scripts/verify-vercel-prebuilt-file-references.mjs

      - name: Deploy staged production without alias mutation
        id: production
        shell: bash
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_stdout="$RUNNER_TEMP/vercel-staged-deploy.stdout"
          deploy_log="$RUNNER_TEMP/vercel-staged-deploy.stderr.log"
          build_started_at="${{ needs.production_build.outputs.build_started_at }}"
          build_completed_at="${{ needs.production_build.outputs.build_completed_at }}"
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          node -e 'const [s,c,d]=process.argv.slice(1).map(Date.parse); if(![s,c,d].every(Number.isFinite)||s>c||c>d) process.exit(1)' "$build_started_at" "$build_completed_at" "$deployed_at"
          node .release-control/scripts/verify-production-main-head-cas.mjs
          set +e
          { pnpm exec vercel deploy --prebuilt --prod --skip-domain --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" \
              --meta "githubCommitSha=$PRODUCT_COMMIT" \
              --meta "novelControlCommit=$CONTROL_COMMIT" \
              --meta "novelDeploymentAuthority=github-actions" \
              --meta "novelWorkflowRunId=$GITHUB_RUN_ID" \
              --meta "novelWorkflowRunAttempt=$GITHUB_RUN_ATTEMPT" \
              --env "NOVEL_BUILD_STARTED_AT=$build_started_at" \
              --env "NOVEL_BUILD_COMPLETED_AT=$build_completed_at" \
              --env "NOVEL_DEPLOYED_AT=$deployed_at" > "$deployment_stdout"; } 2>&1 \
            | perl -pe 'BEGIN { $| = 1; $token = $ENV{"VERCEL_TOKEN"} // ""; } s/\Q$token\E/[REDACTED]/g if length $token' \
            | tee "$deploy_log" >&2
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          deploy_status="${pipeline_status[0]}"
          sanitizer_status="${pipeline_status[1]}"
          capture_status="${pipeline_status[2]}"
          if (( deploy_status != 0 )); then
            echo "Vercel staged deployment failed with exit code $deploy_status." >&2
            exit "$deploy_status"
          fi
          if (( sanitizer_status != 0 || capture_status != 0 )); then
            echo "Unable to sanitize or capture Vercel staged deployment output." >&2
            exit 1
          fi
          # Vercel CLI reserves stdout for the deployment URL; diagnostics stream through sanitized stderr above.
          deployment_url="$(sed -e 's/\r$//' "$deployment_stdout")"
          if [[ ! "$deployment_url" =~ ^https://[[:alnum:]]([[:alnum:]-]{0,61}[[:alnum:]])?[.]vercel[.]app/?$ ]]; then
            echo "Vercel staged deployment stdout did not contain exactly one valid deployment URL." >&2
            exit 1
          fi
          deployment_url="${deployment_url%/}"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$deployed_at" >> "$GITHUB_OUTPUT"

      - name: Verify exact staged Product identity before control-plane sealing
        id: production_static_identity
        shell: bash
        env:
          STAGED_URL: ${{ steps.production.outputs.url }}
        run: |
          set -euo pipefail
          identity_url="$STAGED_URL/api/release/identity"
          for attempt in {1..15}; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$identity_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              release_product_commit="$(jq -r '.releaseProductCommit // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              provenance_status="$(jq -r '.provenanceStatus // empty' <<<"$body")"
              environment="$(jq -r '.environment // empty' <<<"$body")"
              release_line="$(jq -r '.releaseLine // empty' <<<"$body")"
              release_tag="$(jq -r '.releaseTag // empty' <<<"$body")"
              release_revision="$(jq -r '.releaseRevision // empty' <<<"$body")"
              release_name="$(jq -r '.releaseName // empty' <<<"$body")"
              consumer_release="$(jq -r '.consumerRelease // empty' <<<"$body")"
              architecture_stage="$(jq -r '.architectureStage // empty' <<<"$body")"
              if [[ "$app_commit" == "$PRODUCT_COMMIT" \
                && "$release_product_commit" == "$PRODUCT_COMMIT" \
                && "$deployment_id" =~ ^dpl_[A-Za-z0-9]{8,96}$ \
                && "$provenance_status" == verified \
                && "$environment" == production \
                && "$release_line" == "$EXPECTED_RELEASE_LINE" \
                && "$release_tag" == "$EXPECTED_RELEASE_TAG" \
                && "$release_revision" == "$EXPECTED_RELEASE_REVISION" \
                && "$release_name" == "$EXPECTED_RELEASE_NAME" \
                && "$consumer_release" == "$EXPECTED_CONSUMER_RELEASE" \
                && "$architecture_stage" == "$EXPECTED_ARCHITECTURE_STAGE" ]]; then
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged identity was not the exact immutable Product; Production evidence was not published." >&2
          exit 1

      - name: Prove exact single Vercel Production deployment in the control plane
        id: production_control_plane
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.production_static_identity.outputs.deployment_id }}
        run: |
          set -euo pipefail
          evidence_directory="$RUNNER_TEMP/production-deployment-authority"
          receipt_path="$evidence_directory/production-deployment-authority.json"
          receipt_sidecar="$evidence_directory/production-deployment-authority.sha256"
          candidate_path="$RUNNER_TEMP/production-deployment-authority-candidate.json"
          test ! -e "$evidence_directory"
          mkdir "$evidence_directory"
          query_since_ms="$(( $(date -u +%s) * 1000 - 86400000 ))"
          verified=false
          for attempt in {1..10}; do
            query_until_ms="$(( $(date -u +%s) * 1000 + 10000 ))"
            set +e
            env \
              EXPECTED_DEPLOYMENT_ID="$EXPECTED_DEPLOYMENT_ID" \
              EXPECTED_PRODUCT_COMMIT="$PRODUCT_COMMIT" \
              EXPECTED_CONTROL_COMMIT="$CONTROL_COMMIT" \
              EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
              EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              QUERY_SINCE_MS="$query_since_ms" \
              QUERY_UNTIL_MS="$query_until_ms" \
              PRODUCTION_AUTHORITY_RECEIPT_SCHEMA="p24b-production-deployment-authority-v1" \
              PRODUCTION_AUTHORITY_RECEIPT_PATH="$candidate_path" \
              node .release-control/scripts/run-main-push-auto-deploy-workflow-contract.mjs verify-vercel-production-authority
            verifier_status="$?"
            set -e
            if [[ "$verifier_status" == 0 ]]; then
              cp "$candidate_path" "$receipt_path"
              verified=true
              break
            fi
            if [[ "$verifier_status" != 75 ]]; then
              echo "Vercel Production deployment authority verification failed closed." >&2
              exit "$verifier_status"
            fi
            sleep 3
          done
          test "$verified" = true
          jq -e '.pageCount >= 1 and .paginationComplete == true' "$receipt_path" >/dev/null
          test "$(jq -r '.rawApiBodyIncluded' "$receipt_path")" = false
          test "$(jq -r '.duplicateProductionDeploymentCount' "$receipt_path")" = 0
          receipt_digest="$(sha256sum "$receipt_path" | awk '{print $1}')"
          printf '%s  %s\n' "$receipt_digest" "$(basename "$receipt_path")" > "$receipt_sidecar"
          echo "production_deployment_authority=github-actions" >> "$GITHUB_OUTPUT"
          echo "production_deployment_match_count=1" >> "$GITHUB_OUTPUT"
          echo "duplicate_production_deploy_count=0" >> "$GITHUB_OUTPUT"
          echo "receipt_digest=$receipt_digest" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized Vercel Production deployment authority evidence
        id: production_authority_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deployment-authority-${{ env.PRODUCT_COMMIT }}-control-${{ env.CONTROL_COMMIT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment-authority
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Atomically seal exact RC6.4 Production static network manifest
        if: github.event_name == 'push'
        id: production_static_manifest
        shell: bash
        env:
          RC6_4_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          RC6_4_PRODUCTION_DEPLOYMENT_ID: ${{ steps.production_static_identity.outputs.deployment_id }}
          RC6_4_PRODUCTION_ORIGIN: https://novel-orcin.vercel.app
          RC6_4_PRODUCTION_STATIC_ASSET_ROOT: ${{ runner.temp }}/rc6-4-production-static-source/.vercel/output/static
          NEXT_PUBLIC_RC6_4_BROWSER_PROSE_DIAGNOSTICS: '0'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/production-prebuilt/production-prebuilt.tgz"
          diagnostics_receipt="$RUNNER_TEMP/production-prebuilt/rc6-4-production-diagnostics-seam.json"
          sealed_source="$RUNNER_TEMP/rc6-4-production-static-source"
          evidence_directory="$RUNNER_TEMP/rc6-4-production-static-network"
          test -f "$archive"
          test -f "$diagnostics_receipt"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.production_build.outputs.archive_sha256 }}"
          test "$(jq -r '.status' "$diagnostics_receipt")" = PASS
          test "$(jq -r '.productCommit' "$diagnostics_receipt")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.releaseTag' "$diagnostics_receipt")" = "$EXPECTED_RELEASE_TAG"
          test "$(jq -r '.diagnosticsFlag' "$diagnostics_receipt")" = 0
          test "$(jq -r '.markerHits' "$diagnostics_receipt")" = 0
          test ! -e "$sealed_source"
          test ! -e "$evidence_directory"
          mkdir "$sealed_source"
          tar --extract --gzip --file "$archive" --directory "$sealed_source" .vercel/output/static
          test -d "$RC6_4_PRODUCTION_STATIC_ASSET_ROOT"
          export RC6_4_PRODUCTION_STATIC_MANIFEST_PATH="$evidence_directory/rc6.4-production-static-network-manifest.json"
          export RC6_4_PRODUCTION_STATIC_SIDECAR_PATH="$evidence_directory/rc6.4-production-static-network-manifest.sha256"
          node scripts/generate-rc6-4-production-static-network-manifest.mjs generate
          validation="$(node scripts/generate-rc6-4-production-static-network-manifest.mjs validate)"
          test "$(jq -r '.status' <<<"$validation")" = PASS
          test "$(jq -r '.productCommit' <<<"$validation")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.deploymentId' <<<"$validation")" = "$RC6_4_PRODUCTION_DEPLOYMENT_ID"
          test "$(jq -r '.productionOrigin' <<<"$validation")" = "$RC6_4_PRODUCTION_ORIGIN"
          manifest_digest="$(jq -er '.manifestDigest | select(test("^[0-9a-f]{64}$"))' <<<"$validation")"
          manifest_file_digest="$(jq -er '.manifestFileDigest | select(test("^[0-9a-f]{64}$"))' <<<"$validation")"
          asset_domain_digest="$(jq -er '.assetDomainDigest | select(test("^[0-9a-f]{64}$"))' <<<"$validation")"
          test "$(sha256sum "$RC6_4_PRODUCTION_STATIC_MANIFEST_PATH" | awk '{print $1}')" = "$manifest_file_digest"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          echo "manifest_file_digest=$manifest_file_digest" >> "$GITHUB_OUTPUT"
          echo "asset_domain_digest=$asset_domain_digest" >> "$GITHUB_OUTPUT"

      - name: Upload exact RC6.4 Production static network evidence
        if: github.event_name == 'push'
        id: production_static_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc6-4-production-static-network-${{ env.PRODUCT_COMMIT }}-${{ steps.production_static_identity.outputs.deployment_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rc6-4-production-static-network
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  runtime_gates:
    name: runtime gates
    needs: [validate, staged_deploy]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deployment_id: ${{ steps.staged.outputs.deployment_id }}
      temporal_proof_digest: ${{ steps.temporal.outputs.proof_digest }}
    env:
      STAGED_URL: ${{ needs.staged_deploy.outputs.url }}
      NOVEL_BUILD_STARTED_AT: ${{ needs.staged_deploy.outputs.build_started_at }}
      NOVEL_BUILD_COMPLETED_AT: ${{ needs.staged_deploy.outputs.build_completed_at }}
      NOVEL_DEPLOYED_AT: ${{ needs.staged_deploy.outputs.deployed_at }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EXPECTED_XAI_MODEL_ID: grok-4.5
      XAI_EXPECTED: ${{ secrets.XAI_API_KEY != '' }}
      EXPECTED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      EXPECTED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
      EXPECTED_RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      EXPECTED_CONSUMER_RELEASE: ${{ needs.validate.outputs.consumer_release }}
      EXPECTED_ARCHITECTURE_STAGE: ${{ needs.validate.outputs.architecture_stage }}
    steps:
      - name: Checkout trusted Production control commit for runtime proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable Product commit for runtime timestamp proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: .release-product
          persist-credentials: false

      - name: Enforce dual-SHA runtime proof checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          test "$(git -C .release-product rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$CONTROL_COMMIT"

      - name: Set up Node.js for runtime proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare exact Product checkout for staged mobile gates
        if: github.event_name == 'push'
        working-directory: .release-product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-consumer-evidence"
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Install locked Chromium and WebKit for staged mobile gates
        if: github.event_name == 'push'
        working-directory: .release-product
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify complete public mobile journeys on the staged deployment
        if: github.event_name == 'push'
        working-directory: .release-product
        shell: bash
        env:
          MOBILE_BASE_URL: ${{ env.STAGED_URL }}
        run: |
          set -euo pipefail
          {
            pnpm test:studio:humanized-navigation-diagnostics
            # A staged gate intentionally starts with WebKit before the longer
            # Chromium sweep accumulates automated traffic at Vercel's edge.
            # Both engines and every viewport still run before alias cutover.
            for engine in webkit chromium; do
              MOBILE_BROWSER_ENGINE="$engine" pnpm test:mobile:consumer-experience
              for viewport in 320x568 375x812 390x844 430x932; do
                MOBILE_BROWSER_ENGINE="$engine" MOBILE_VIEWPORT="$viewport" pnpm test:studio:humanized-browser -- "$MOBILE_BASE_URL"
              done
            done
          } 2>&1 | tee "$RUNNER_TEMP/mobile-consumer-evidence/staged-mobile-consumer-gates.log"

      - name: Upload staged public mobile evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-mobile-consumer-${{ env.PRODUCT_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-consumer-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Verify staged production identity
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          identity_url="$STAGED_URL/api/release/identity"
          for attempt in {1..15}; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$identity_url" 2>/dev/null)"; then
              app_commit="$(jq -r '.appCommit // empty' <<<"$body")"
              release_product_commit="$(jq -r '.releaseProductCommit // empty' <<<"$body")"
              deployment_id="$(jq -r '.deploymentId // empty' <<<"$body")"
              provenance_status="$(jq -r '.provenanceStatus // empty' <<<"$body")"
              environment="$(jq -r '.environment // empty' <<<"$body")"
              release_tag="$(jq -r '.releaseTag // empty' <<<"$body")"
              release_revision="$(jq -r '.releaseRevision // empty' <<<"$body")"
              release_line="$(jq -r '.releaseLine // empty' <<<"$body")"
              release_name="$(jq -r '.releaseName // empty' <<<"$body")"
              consumer_release="$(jq -r '.consumerRelease // empty' <<<"$body")"
              architecture_stage="$(jq -r '.architectureStage // empty' <<<"$body")"
              temporal_status="$(jq -r '.temporalProvenanceStatus // empty' <<<"$body")"
              build_started_at="$(jq -r '.buildStartedAt // empty' <<<"$body")"
              build_completed_at="$(jq -r '.buildCompletedAt // empty' <<<"$body")"
              deployed_at="$(jq -r '.deployedAt // empty' <<<"$body")"
              if [[ "$app_commit" == "$PRODUCT_COMMIT" && "$release_product_commit" == "$PRODUCT_COMMIT" && -n "$deployment_id" && "$provenance_status" == "verified" && "$temporal_status" == "verified" && "$environment" == "production" && "$release_line" == "$EXPECTED_RELEASE_LINE" && "$release_tag" == "$EXPECTED_RELEASE_TAG" && "$release_revision" == "$EXPECTED_RELEASE_REVISION" && "$release_name" == "$EXPECTED_RELEASE_NAME" && "$consumer_release" == "$EXPECTED_CONSUMER_RELEASE" && "$architecture_stage" == "$EXPECTED_ARCHITECTURE_STAGE" && "$build_started_at" == "$NOVEL_BUILD_STARTED_AT" && "$build_completed_at" == "$NOVEL_BUILD_COMPLETED_AT" && "$deployed_at" == "$NOVEL_DEPLOYED_AT" ]]; then
                printf '%s' "$body" > "$RUNNER_TEMP/staged-release-identity.json"
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged release identity did not match immutable Product commit $PRODUCT_COMMIT." >&2
          exit 1

      - name: Bind runtime build/deploy truth to Vercel v13 createdAt
        id: temporal
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          EXPECTED_APP_COMMIT: ${{ env.PRODUCT_COMMIT }}
          EXPECTED_CONTROL_COMMIT: ${{ github.sha }}
          RUNTIME_IDENTITY_PATH: ${{ runner.temp }}/staged-release-identity.json
          TEMPORAL_PROOF_PATH: ${{ runner.temp }}/staged-deployment-temporal-proof.json
        shell: bash
        run: |
          set -euo pipefail
          export EXPECTED_PRODUCT_COMMIT_TIME="$(git -C .release-product show -s --format=%cI "$PRODUCT_COMMIT")"
          node scripts/verify-deployment-temporal-provenance.mjs
          proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$TEMPORAL_PROOF_PATH")"
          echo "proof_digest=$proof_digest" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized staged temporal provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-temporal-proof-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staged-deployment-temporal-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify staged demand-loaded manual learning Worker asset
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$STAGED_URL/generated/manual-learning-worker.js?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_body="$RUNNER_TEMP/manual-learning-worker.js"
          worker_headers="$RUNNER_TEMP/manual-learning-worker.headers"
          for attempt in {1..10}; do
            : > "$worker_body"
            : > "$worker_headers"
            if status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error \
              --output "$worker_body" --dump-header "$worker_headers" --write-out '%{http_code}' \
              "$worker_url" 2>/dev/null)" && [[ "$status" == "200" ]]; then
              content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print }' "$worker_headers" | tail -n 1)"
              bytes="$(wc -c < "$worker_body" | tr -d '[:space:]')"
              if [[ "$content_type" =~ (java|ecma)script ]] \
                && (( bytes >= 500000 && bytes <= 3500000 )) \
                && grep -aFq 'LEARNING_FILE_MAGIC_MISMATCH' "$worker_body" \
                && grep -aFq 'splitManualLearningDocumentSemantically' "$worker_body" \
                && grep -aFq 'LEARNING_WORKER_DUPLICATE_REQUEST' "$worker_body" \
                && grep -aFq 'prepare_import_file' "$worker_body" \
                && grep -aFq 'manual-learning-worker-protocol-v2' "$worker_body" \
                && ! head -c 512 "$worker_body" | grep -aiq '<!doctype html'; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged manual learning Worker asset is missing or invalid; aliases remain unchanged." >&2
          exit 1

      - name: Verify staged encrypted cloud sync runtime
        id: staged_health
        shell: bash
        run: |
          set -euo pipefail
          health_url="$STAGED_URL/api/persistence/sync/health?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..15}; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$health_url" 2>/dev/null)"; then
              status="$(jq -r '.status // empty' <<<"$body")"
              migration="$(jq -r '.migrationVersion // empty' <<<"$body")"
              schema="$(jq -r '.schemaVersion // empty' <<<"$body")"
              backend="$(jq -r '.storageBackend // empty' <<<"$body")"
              if [[ "$status" == "ready" && "$migration" == "cloud_sync_e2ee_storage_001" && "$schema" == "novel-cloud-sync-e2ee-v1" && "$backend" == "private-object-storage" ]]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged encrypted cloud sync runtime is not ready; aliases remain unchanged." >&2
          exit 1

      - name: Verify staged public lounge runtime and privacy boundary
        if: github.event_name == 'push'
        id: staged_public_lounge
        env:
          PUBLIC_LOUNGE_RUNTIME_ORIGINS: ${{ env.STAGED_URL }}
          PUBLIC_LOUNGE_RUNTIME_PHASE: staged-production
          PUBLIC_LOUNGE_RUNTIME_REPORT_PATH: ${{ runner.temp }}/staged-public-lounge-runtime.json
          PUBLIC_LOUNGE_INTERACTIONS_EXPECTED_STATE: fail-closed
        run: node scripts/verify-public-lounge-runtime.mjs

      - name: Record immutable-recovery Public Lounge runtime waiver
        if: github.event_name != 'push'
        shell: bash
        run: |
          printf '%s\n' '{"schemaVersion":"public-lounge-runtime-waiver-v1","status":"WAIVED","reason":"immutable-product-recovery-predates-public-lounge-runtime-contract","freshRuntimeRun":false}' > "$RUNNER_TEMP/staged-public-lounge-runtime-waiver.json"

      - name: Verify staged public lounge in a real browser
        if: github.event_name == 'push'
        working-directory: .release-product
        env:
          PUBLIC_LOUNGE_BROWSER_ORIGINS: ${{ env.STAGED_URL }}
          PUBLIC_LOUNGE_RUNTIME_PHASE: staged-production
          PUBLIC_LOUNGE_BROWSER_REPORT_PATH: ${{ runner.temp }}/staged-public-lounge-browser.json
          PUBLIC_LOUNGE_INTERACTIONS_EXPECTED_STATE: fail-closed
        run: node scripts/verify-public-lounge-browser.mjs

      - name: Upload staged public lounge runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-public-lounge-runtime-${{ env.PRODUCT_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staged-public-lounge-runtime.json
            ${{ runner.temp }}/staged-public-lounge-runtime-waiver.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload staged public lounge browser evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-public-lounge-browser-${{ env.PRODUCT_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staged-public-lounge-browser.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify staged external AI truth and provider isolation
        id: staged_teachers
        shell: bash
        run: |
          set -euo pipefail
          providers_url="$STAGED_URL/api/ai/external/providers?probe=1&providers=openai,grok&verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..15}; do
            if body="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error \
              --header "Origin: $STAGED_URL" \
              --header "Referer: $STAGED_URL/" \
              --header "Sec-Fetch-Site: same-origin" \
              "$providers_url" 2>/dev/null)"; then
              openai_not_configured="$(jq -r 'any(.providers[]?; .id == "openai" and .configured == false and .verification == "not_configured" and .verificationCode == "NOT_CONFIGURED")' <<<"$body")"
              openai_verified="$(jq -r 'any(.providers[]?; .id == "openai" and .configured == true and .verification == "verified" and .verificationCode == "MODEL_ACCESS_VERIFIED")' <<<"$body")"
              grok_not_configured="$(jq -r 'any(.providers[]?; .id == "grok" and .configured == false and .verification == "not_configured" and .verificationCode == "NOT_CONFIGURED")' <<<"$body")"
              grok_verified="$(jq -r --arg expectedModel "$EXPECTED_XAI_MODEL_ID" 'any(.providers[]?; .id == "grok" and .configured == true and .verification == "verified" and .verificationCode == "MODEL_ACCESS_VERIFIED" and .modelId == $expectedModel)' <<<"$body")"
              credential_mode="$(jq -r '.credentials // empty' <<<"$body")"
              provider_verification="$(jq -r '.verification // empty' <<<"$body")"
              probe_performed="$(jq -r 'if has("probePerformed") then .probePerformed else false end' <<<"$body")"
              silent_fallback="$(jq -r 'if has("silentFallback") then .silentFallback else true end' <<<"$body")"
              execution_enabled="$(jq -r 'if has("executionEnabled") then .executionEnabled else true end' <<<"$body")"
              operational="$(jq -r 'if has("operational") then .operational else true end' <<<"$body")"
              provider_count="$(jq -r '[.providers[]?] | length' <<<"$body")"
              openai_count="$(jq -r '[.providers[]? | select(.id == "openai")] | length' <<<"$body")"
              grok_count="$(jq -r '[.providers[]? | select(.id == "grok")] | length' <<<"$body")"
              provider_boundaries="$(jq -r 'all(.providers[]?; .serverSideCredentialOnly == true and .dataLeavesDevice == true)' <<<"$body")"
              grok_safe="false"
              if [[ "$XAI_EXPECTED" == "true" && "$grok_verified" == "true" ]]; then
                grok_safe="true"
              elif [[ "$XAI_EXPECTED" == "false" && ("$grok_not_configured" == "true" || "$grok_verified" == "true") ]]; then
                grok_safe="true"
              fi
              optional_provider_absent="false"
              if [[ "$openai_not_configured" == "true" || ("$XAI_EXPECTED" == "false" && "$grok_not_configured" == "true") ]]; then
                optional_provider_absent="true"
              fi
              top_level_safe="false"
              if [[ "$optional_provider_absent" == "true" && "$provider_verification" == "degraded" ]]; then
                top_level_safe="true"
              elif [[ "$optional_provider_absent" == "false" && "$openai_verified" == "true" && "$grok_verified" == "true" && "$provider_verification" == "verified" ]]; then
                top_level_safe="true"
              fi
              if [[ "$grok_safe" == "true" && ("$openai_not_configured" == "true" || "$openai_verified" == "true") && "$top_level_safe" == "true" && "$credential_mode" == "server-side-only" && "$probe_performed" == "true" && "$silent_fallback" == "false" && "$execution_enabled" == "false" && "$operational" == "false" && "$provider_count" == "2" && "$openai_count" == "1" && "$grok_count" == "1" && "$provider_boundaries" == "true" ]]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Staged external AI truth surface is invalid; aliases remain unchanged." >&2
          exit 1

  alias_cutover:
    name: alias cutover
    needs: [validate, staged_deploy, runtime_gates]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery')
    runs-on: ubuntu-latest
    # The complete runtime and browser proof has its own fifteen-minute hard deadline. Keep a
    # separate job-level reserve so a timed-out proof can still restore both
    # aliases before GitHub terminates the runner.
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_FETCH_TIMEOUT_MS: 10000
      ALIAS_CAPTURE_DEADLINE_MS: 60000
      ROLLBACK_TARGET_SELECTION_DEADLINE_MS: 60000
      CUTOVER_DEADLINE_MS: 360000
      CUTOVER_ROLLBACK_RESERVE_MS: 180000
      POST_CUTOVER_DEADLINE_MS: 180000
      PUBLIC_GATE_FETCH_TIMEOUT_MS: 10000
      ROLLBACK_DEADLINE_MS: 240000
      EXPECTED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
      EXPECTED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      EXPECTED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
      EXPECTED_RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      EXPECTED_CONSUMER_RELEASE: ${{ needs.validate.outputs.consumer_release }}
      EXPECTED_ARCHITECTURE_STAGE: ${{ needs.validate.outputs.architecture_stage }}
    steps:
      - name: Checkout trusted Production control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Checkout immutable Product commit for release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_COMMIT }}
          path: .release-product
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare exact Product checkout for post-cutover mobile proof
        if: github.event_name == 'push'
        working-directory: .release-product
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile

      - name: Install locked Chromium and WebKit for post-cutover mobile proof
        if: github.event_name == 'push'
        working-directory: .release-product
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Reproduce and bind recovery control proof for Last Known Good publication
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_CONTROL_PROOF_PATH: ${{ runner.temp }}/recovery-control-proof-for-lkg.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-recovery-control.mjs
          proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RECOVERY_CONTROL_PROOF_PATH")"
          test "$proof_digest" = "${{ needs.validate.outputs.recovery_control_proof_digest }}"

      - name: Refuse stale main control commit before preparing alias cutover
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Re-verify immutable annotated release tag for Production evidence
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASE_REQUIRE_REPOSITORY_SETTING: 'false'
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/immutable-release-tag-proof.json
        working-directory: .release-product
        run: node scripts/verify-immutable-release-tag.mjs remote

      - name: Rebind GitHub Release database identity from immutable tag proof
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        shell: bash
        run: |
          set -euo pipefail
          release_database_id="$(jq -er '.immutableReleaseId | tostring | select(test("^[1-9][0-9]{0,19}$"))' "$RUNNER_TEMP/immutable-release-tag-proof.json")"
          test "$(jq -r '.releaseTag' "$RUNNER_TEMP/immutable-release-tag-proof.json")" = "$EXPECTED_RELEASE_TAG"
          test "$(jq -r '.productCommit' "$RUNNER_TEMP/immutable-release-tag-proof.json")" = "$PRODUCT_COMMIT"
          echo "EXPECTED_RELEASE_DATABASE_ID=$release_database_id" >> "$GITHUB_ENV"

      - name: Re-verify GitHub-signed immutable Release attestation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/immutable-release-tag-proof.json
          RELEASE_ATTESTATION_PROOF_PATH: ${{ runner.temp }}/github-release-attestation-proof.json
        run: node scripts/verify-github-release-attestation.mjs

      - name: Download sanitized staged Production deployment authority evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: production-deployment-authority-${{ env.PRODUCT_COMMIT }}-control-${{ env.CONTROL_COMMIT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment-authority

      - name: Verify staged Production deployment authority receipt independently
        shell: bash
        run: |
          set -euo pipefail
          receipt_directory="$RUNNER_TEMP/production-deployment-authority"
          receipt_path="$receipt_directory/production-deployment-authority.json"
          receipt_sidecar="$receipt_directory/production-deployment-authority.sha256"
          test -f "$receipt_path"
          test -f "$receipt_sidecar"
          (cd "$receipt_directory" && sha256sum --check "$(basename "$receipt_sidecar")")
          test "$(sha256sum "$receipt_path" | awk '{print $1}')" = "${{ needs.staged_deploy.outputs.production_authority_receipt_digest }}"
          [[ "${{ needs.staged_deploy.outputs.production_authority_artifact_id }}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${{ needs.staged_deploy.outputs.production_authority_artifact_digest }}" =~ ^(sha256:)?[a-f0-9]{64}$ ]]
          test "$(jq -r '.status' "$receipt_path")" = PASS
          test "$(jq -r '.productCommit' "$receipt_path")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.controlCommit' "$receipt_path")" = "$CONTROL_COMMIT"
          test "$(jq -r '.deploymentId' "$receipt_path")" = "${{ needs.staged_deploy.outputs.deployment_id }}"
          test "$(jq -r '.deploymentId' "$receipt_path")" = "${{ needs.runtime_gates.outputs.deployment_id }}"
          test "$(jq -r '.productionDeploymentAuthority' "$receipt_path")" = github-actions
          test "$(jq -r '.matchingProductionDeploymentCount' "$receipt_path")" = 1
          test "$(jq -r '.duplicateProductionDeploymentCount' "$receipt_path")" = 0
          jq -e '.pageCount >= 1 and .paginationComplete == true' "$receipt_path" >/dev/null
          test "$(jq -r '.rawApiBodyIncluded' "$receipt_path")" = false

      - name: Recheck exact single Vercel Production deployment immediately before cutover
        id: production_authority_recheck
        shell: bash
        run: |
          set -euo pipefail
          prior_receipt="$RUNNER_TEMP/production-deployment-authority/production-deployment-authority.json"
          evidence_directory="$RUNNER_TEMP/production-deployment-authority-recheck"
          receipt_path="$evidence_directory/production-deployment-authority-recheck.json"
          receipt_sidecar="$evidence_directory/production-deployment-authority-recheck.sha256"
          query_since_ms="$(jq -er '.querySinceMs | tostring | select(test("^[0-9]{13}$"))' "$prior_receipt")"
          query_until_ms="$(( $(date -u +%s) * 1000 + 10000 ))"
          test ! -e "$evidence_directory"
          mkdir "$evidence_directory"
          env \
            EXPECTED_DEPLOYMENT_ID="${{ needs.runtime_gates.outputs.deployment_id }}" \
            EXPECTED_PRODUCT_COMMIT="$PRODUCT_COMMIT" \
            EXPECTED_CONTROL_COMMIT="$CONTROL_COMMIT" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            QUERY_SINCE_MS="$query_since_ms" \
            QUERY_UNTIL_MS="$query_until_ms" \
            PRODUCTION_AUTHORITY_RECEIPT_SCHEMA="p24b-production-deployment-authority-recheck-v1" \
            PRODUCTION_AUTHORITY_RECEIPT_PATH="$receipt_path" \
            node scripts/run-main-push-auto-deploy-workflow-contract.mjs verify-vercel-production-authority
          jq -e '.pageCount >= 1 and .paginationComplete == true' "$receipt_path" >/dev/null
          test "$(jq -r '.duplicateProductionDeploymentCount' "$receipt_path")" = 0
          test "$(jq -r '.rawApiBodyIncluded' "$receipt_path")" = false
          receipt_digest="$(sha256sum "$receipt_path" | awk '{print $1}')"
          printf '%s  %s\n' "$receipt_digest" "$(basename "$receipt_path")" > "$receipt_sidecar"
          echo "production_deployment_authority=github-actions" >> "$GITHUB_OUTPUT"
          echo "duplicate_production_deploy_count=0" >> "$GITHUB_OUTPUT"
          echo "receipt_digest=$receipt_digest" >> "$GITHUB_OUTPUT"

      - name: Upload pre-cutover Production deployment authority recheck
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deployment-authority-recheck-${{ env.PRODUCT_COMMIT }}-control-${{ env.CONTROL_COMMIT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-deployment-authority-recheck
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Capture current dual-alias transaction identity
        id: aliases_before
        continue-on-error: true
        run: node scripts/vercel-dual-alias-cutover.mjs capture

      - name: Discover latest successful Last Known Good artifact
        id: lkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: node scripts/production-last-known-good.mjs discover

      - name: Require exact prior RC6.2 Last Known Good only for recovery cutover
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lkg.outputs.available }}" = true
          test "${{ steps.lkg.outputs.artifact_id }}" = "$RC6_2_LKG_ARTIFACT_ID"
          test "${{ steps.lkg.outputs.artifact_name }}" = "$RC6_2_LKG_ARTIFACT_NAME"
          test "${{ steps.lkg.outputs.artifact_digest }}" = "$RC6_2_LKG_ARTIFACT_DIGEST"
          test "${{ steps.lkg.outputs.run_id }}" = "$RC6_2_LKG_RUN_ID"
          test "${{ steps.lkg.outputs.product_commit }}" = "$RC6_2_LKG_APP_COMMIT"
          test "${{ steps.lkg.outputs.control_commit }}" = "$RC6_2_LKG_CONTROL_COMMIT"

      - name: Require latest verified Last Known Good for normal cutover
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          LKG_PUBLICATION_MODE: ${{ steps.lkg.outputs.publication_mode }}
          LKG_SEED_ELIGIBLE: ${{ steps.lkg.outputs.seed_eligible }}
          LKG_ARTIFACT_NAME: ${{ steps.lkg.outputs.artifact_name }}
          LKG_PRODUCT_COMMIT: ${{ steps.lkg.outputs.product_commit }}
          LKG_CONTROL_COMMIT: ${{ steps.lkg.outputs.control_commit }}
        run: |
          set -euo pipefail
          test "${{ steps.lkg.outputs.available }}" = true
          [[ "${{ steps.lkg.outputs.artifact_id }}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${{ steps.lkg.outputs.artifact_name }}" =~ ^production-last-known-good-[a-z0-9-]+$ ]]
          [[ "${{ steps.lkg.outputs.artifact_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${{ steps.lkg.outputs.product_commit }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ steps.lkg.outputs.control_commit }}" =~ ^[a-f0-9]{40}$ ]]
          test "${{ steps.lkg.outputs.workflow_branch }}" = main
          case "$LKG_PUBLICATION_MODE:$LKG_SEED_ELIGIBLE" in
            same-sha:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-${LKG_PRODUCT_COMMIT}"
              ;;
            immutable-product-control:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-control-${LKG_CONTROL_COMMIT}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            repository-migration-seed:true)
              test "$GITHUB_REPOSITORY" = brendonlee1006/novel
              test "$GITHUB_REPOSITORY_ID" = 1357493987
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-migration-control-${LKG_CONTROL_COMMIT}-consumer-${GITHUB_RUN_ID}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            *)
              echo "Refusing Last Known Good with an unsupported publication-mode/seed-eligibility pair." >&2
              exit 1
              ;;
          esac

      - name: Download latest Last Known Good identity
        if: steps.lkg.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          LAST_KNOWN_GOOD_ARTIFACT_ID: ${{ steps.lkg.outputs.artifact_id }}
          LAST_KNOWN_GOOD_ARTIFACT_NAME: ${{ steps.lkg.outputs.artifact_name }}
          LAST_KNOWN_GOOD_ARTIFACT_DIGEST: ${{ steps.lkg.outputs.artifact_digest }}
          LAST_KNOWN_GOOD_RUN_ID: ${{ steps.lkg.outputs.run_id }}
          LAST_KNOWN_GOOD_HEAD_SHA: ${{ steps.lkg.outputs.head_sha }}
          LAST_KNOWN_GOOD_PRODUCT_COMMIT: ${{ steps.lkg.outputs.product_commit }}
          LAST_KNOWN_GOOD_CONTROL_COMMIT: ${{ steps.lkg.outputs.control_commit }}
          LAST_KNOWN_GOOD_WORKFLOW_EVENT: ${{ steps.lkg.outputs.workflow_event }}
          LAST_KNOWN_GOOD_WORKFLOW_BRANCH: ${{ steps.lkg.outputs.workflow_branch }}
          LAST_KNOWN_GOOD_RUN_ATTEMPT: ${{ steps.lkg.outputs.run_attempt }}
          LAST_KNOWN_GOOD_WORKFLOW_PATH: ${{ steps.lkg.outputs.workflow_path }}
          LAST_KNOWN_GOOD_CREATED_AT: ${{ steps.lkg.outputs.created_at }}
          LAST_KNOWN_GOOD_PUBLICATION_MODE: ${{ steps.lkg.outputs.publication_mode }}
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_LKG_APP_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && env.RC6_2_LKG_APP_COMMIT || '' }}
          EXPECTED_LKG_PRIMARY_DEPLOYMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && env.RC6_2_LKG_PRIMARY_DEPLOYMENT_ID || '' }}
          EXPECTED_LKG_MIRROR_DEPLOYMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && env.RC6_2_LKG_MIRROR_DEPLOYMENT_ID || '' }}
          EXPECTED_LKG_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && env.RC6_2_LKG_RELEASE_TAG || '' }}
          EXPECTED_LKG_RELEASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && env.RC6_2_LKG_RELEASE_REVISION || '' }}
        run: node scripts/production-last-known-good.mjs download

      - name: Prove downloaded Last Known Good selection independently for cutover
        if: steps.lkg.outputs.available == 'true'
        id: lkg_live_selection
        env:
          DISABLE_CURRENT_CAPTURE: 'true'
          LAST_KNOWN_GOOD_AVAILABLE: 'true'
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/last-known-good-artifact-proof.json
          ROLLBACK_SELECTION_PROOF_PATH: ${{ runner.temp }}/lkg-independent-selection-proof.json
        run: node scripts/production-last-known-good.mjs select

      - name: Require independent cutover Last Known Good selection proof
        if: steps.lkg.outputs.available == 'true'
        shell: bash
        run: test "${{ steps.lkg_live_selection.outputs.source }}" = last-known-good

      - name: Select and verify rollback target in dynamic priority order
        id: rollback
        env:
          CURRENT_PRIMARY_DEPLOYMENT: ${{ steps.aliases_before.outputs.primary_deployment_id }}
          CURRENT_PRIMARY_COMMIT: ${{ steps.aliases_before.outputs.primary_app_commit }}
          CURRENT_MIRROR_DEPLOYMENT: ${{ steps.aliases_before.outputs.mirror_deployment_id }}
          CURRENT_MIRROR_COMMIT: ${{ steps.aliases_before.outputs.mirror_app_commit }}
          LAST_KNOWN_GOOD_AVAILABLE: ${{ steps.lkg.outputs.available }}
          LAST_KNOWN_GOOD_PATH: ${{ steps.lkg.outputs.available == 'true' && format('{0}/last-known-good-production.json', runner.temp) || '' }}
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ steps.lkg.outputs.available == 'true' && format('{0}/last-known-good-artifact-proof.json', runner.temp) || '' }}
          EMERGENCY_PRIMARY_DEPLOYMENT: ${{ env.EMERGENCY_RECOVERY_DEPLOYMENT_ID }}
          EMERGENCY_PRIMARY_COMMIT: ${{ env.EMERGENCY_RECOVERY_COMMIT }}
          EMERGENCY_MIRROR_DEPLOYMENT: ${{ env.EMERGENCY_RECOVERY_DEPLOYMENT_ID }}
          EMERGENCY_MIRROR_COMMIT: ${{ env.EMERGENCY_RECOVERY_COMMIT }}
        run: node scripts/production-last-known-good.mjs select

      - name: Recheck immutable GitHub Release immediately before alias cutover
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASE_REQUIRE_REPOSITORY_SETTING: 'false'
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/immutable-release-tag-proof.json
        working-directory: .release-product
        run: node scripts/verify-immutable-release-tag.mjs remote

      - name: Recheck GitHub-signed Release attestation immediately before alias cutover
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/immutable-release-tag-proof.json
          RELEASE_ATTESTATION_PROOF_PATH: ${{ runner.temp }}/github-release-attestation-proof.json
        run: node scripts/verify-github-release-attestation.mjs

      - name: Recheck main head immediately before alias cutover
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Cut over both aliases with atomic compensation
        id: cutover
        continue-on-error: true
        env:
          STAGED_TARGET: ${{ needs.staged_deploy.outputs.url }}
          STAGED_DEPLOYMENT_ID: ${{ needs.runtime_gates.outputs.deployment_id }}
          EXPECTED_COMMIT: ${{ env.PRODUCT_COMMIT }}
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs cutover

      - name: Verify both public aliases and their dynamic assets after cutover
        if: steps.cutover.outcome == 'success'
        id: public_gate
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ env.PRODUCT_COMMIT }}
          POST_CUTOVER_REPORT_PATH: ${{ runner.temp }}/post-cutover-public-verification.json
          PUBLIC_LOUNGE_RUNTIME_ORIGINS: https://${{ env.PRIMARY_ALIAS }},https://${{ env.MIRROR_ALIAS }}
          PUBLIC_LOUNGE_RUNTIME_PHASE: post-cutover-production
          PUBLIC_LOUNGE_RUNTIME_REPORT_PATH: ${{ runner.temp }}/post-cutover-public-lounge-runtime.json
          PUBLIC_LOUNGE_RUNTIME_WAIVER_PATH: ${{ runner.temp }}/post-cutover-public-lounge-runtime-waiver.json
          PUBLIC_LOUNGE_INTERACTIONS_EXPECTED_STATE: fail-closed
          PUBLIC_LOUNGE_BROWSER_ORIGINS: https://${{ env.PRIMARY_ALIAS }},https://${{ env.MIRROR_ALIAS }}
          PUBLIC_LOUNGE_BROWSER_REPORT_PATH: ${{ runner.temp }}/post-cutover-public-lounge-browser.json
          PUBLIC_LOUNGE_BROWSER_WAIVER_PATH: ${{ runner.temp }}/post-cutover-browser-proof-waiver.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-public-cutover.mjs
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            timeout --signal=TERM --kill-after=30s 900s bash -c '
              set -euo pipefail
              node scripts/verify-public-lounge-runtime.mjs
              (cd .release-product && node scripts/verify-public-lounge-browser.mjs)
              cd .release-product
              for origin in https://novel-orcin.vercel.app https://novel-lqtechs-projects.vercel.app; do
                MOBILE_RUNTIME_PHASE=post-cutover-production MOBILE_NEXT_CHUNK_RETRY=exact-once \
                  MOBILE_BASE_URL="$origin" MOBILE_BROWSER_ENGINE=webkit MOBILE_VIEWPORTS=320x568 \
                  node scripts/run-mobile-consumer-experience.mjs "$origin"
                MOBILE_BASE_URL="$origin" MOBILE_BROWSER_ENGINE=chromium MOBILE_VIEWPORTS=390x844 \
                  node scripts/run-mobile-consumer-experience.mjs "$origin"
              done
            ' 2>&1 | tee "$RUNNER_TEMP/post-cutover-mobile-browser.log"
            test -s "$PUBLIC_LOUNGE_RUNTIME_REPORT_PATH"
            test -s "$PUBLIC_LOUNGE_BROWSER_REPORT_PATH"
            test -s "$RUNNER_TEMP/post-cutover-mobile-browser.log"
          else
            # Immutable-product recovery intentionally reuses the browser proof
            # that was bound to that historical release. Record the exception
            # explicitly so a partial artifact bundle cannot masquerade as a
            # fresh post-cutover browser run.
            printf '%s\n' '{"schemaVersion":"public-lounge-runtime-waiver-v1","status":"WAIVED","reason":"immutable-product-recovery-predates-public-lounge-runtime-contract","freshRuntimeRun":false}' > "$PUBLIC_LOUNGE_RUNTIME_WAIVER_PATH"
            printf '%s\n' '{"schemaVersion":"public-lounge-browser-waiver-v1","status":"WAIVED","reason":"immutable-product-recovery-uses-release-bound-browser-proof","freshBrowserRun":false}' > "$PUBLIC_LOUNGE_BROWSER_WAIVER_PATH"
            test -s "$PUBLIC_LOUNGE_RUNTIME_WAIVER_PATH"
            test -s "$PUBLIC_LOUNGE_BROWSER_WAIVER_PATH"
          fi

      - name: Compensating rollback after public verification failure
        if: steps.cutover.outcome == 'success' && steps.public_gate.outcome != 'success'
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

      - name: Upload post-cutover verification evidence
        if: always() && steps.cutover.outcome == 'success'
        id: post_cutover_evidence
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-cutover-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/post-cutover-public-verification.json
            ${{ runner.temp }}/post-cutover-public-lounge-runtime.json
            ${{ runner.temp }}/post-cutover-public-lounge-runtime-waiver.json
            ${{ runner.temp }}/post-cutover-public-lounge-browser.json
            ${{ runner.temp }}/post-cutover-mobile-browser.log
            ${{ runner.temp }}/post-cutover-browser-proof-waiver.json
          if-no-files-found: error
          retention-days: 30

      - name: Final immutable GitHub Release recheck after public cutover
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery' &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success'
        id: immutable_tag_final
        continue-on-error: true
        env:
          EXPECTED_PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASE_REQUIRE_REPOSITORY_SETTING: 'false'
          RELEASE_TAG_PROOF_PATH: ${{ runner.temp }}/immutable-release-tag-proof.json
          RELEASE_ATTESTATION_PROOF_PATH: ${{ runner.temp }}/github-release-attestation-proof.json
        shell: bash
        run: |
          set -euo pipefail
          (cd .release-product && node scripts/verify-immutable-release-tag.mjs remote)
          node scripts/verify-github-release-attestation.mjs

      - name: Final main-head CAS after public cutover
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success')
        id: main_head_final
        continue-on-error: true
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Compensating rollback after immutable Release recheck failure
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery' &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          steps.immutable_tag_final.outcome != 'success'
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

      - name: Compensating rollback after final main-head CAS failure
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome != 'success'
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

      - name: Write Last Known Good only after public verification passes
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          steps.post_cutover_evidence.outcome == 'success'
        id: last_known_good_write
        continue-on-error: true
        env:
          PRIMARY_DEPLOYMENT_ID: ${{ needs.runtime_gates.outputs.deployment_id }}
          MIRROR_DEPLOYMENT_ID: ${{ needs.runtime_gates.outputs.deployment_id }}
          APP_COMMIT: ${{ env.PRODUCT_COMMIT }}
          RELEASE_TAG: ${{ env.EXPECTED_RELEASE_TAG }}
          RELEASE_REVISION: ${{ env.EXPECTED_RELEASE_REVISION }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_CONTROL_PROOF_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && format('{0}/recovery-control-proof-for-lkg.json', runner.temp) || '' }}
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/last-known-good-production.json
        run: node scripts/production-last-known-good.mjs write

      - name: Publish dynamic Last Known Good identity
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          steps.post_cutover_evidence.outcome == 'success' &&
          steps.last_known_good_write.outcome == 'success'
        id: last_known_good_publish
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-immutable-product-recovery' && format('production-last-known-good-control-{0}-product-{1}', github.sha, env.PRODUCT_COMMIT) || format('production-last-known-good-{0}', env.PRODUCT_COMMIT) }}
          path: ${{ runner.temp }}/last-known-good-production.json
          if-no-files-found: error
          retention-days: 90

      - name: Create sanitized post-Production new-LUNA control-plane evidence
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          steps.post_cutover_evidence.outcome == 'success' &&
          steps.last_known_good_write.outcome == 'success' &&
          steps.last_known_good_publish.outcome == 'success'
        id: new_luna_create
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          lkg_digest="$(jq -er '.provenanceDigest | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/last-known-good-production.json")"
          prior_lkg_proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          prior_lkg_artifact_id="$(jq -er '.artifactId' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          prior_lkg_run_id="$(jq -er '.runId' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          prior_lkg_head_sha="$(jq -er '.headSha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          prior_lkg_product_commit="$(jq -er '.productCommit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          prior_lkg_control_commit="$(jq -er '.controlCommit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/last-known-good-artifact-proof.json")"
          lkg_selection_proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/lkg-independent-selection-proof.json")"
          public_post_cutover_receipt_digest="$(sha256sum "$RUNNER_TEMP/post-cutover-public-verification.json" | awk '{print $1}')"
          production_authority_proof_digest="${{ needs.staged_deploy.outputs.production_authority_receipt_digest }}"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          recovery_control_proof_digest="${{ needs.validate.outputs.recovery_control_proof_digest }}"
          [[ "$GITHUB_WORKFLOW_SHA" == "$CONTROL_COMMIT" ]]
          [[ "$production_authority_proof_digest" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.operation }}" == deploy-immutable-product-recovery ]]; then
            immutable_tag_proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/immutable-release-tag-proof.json")"
            release_attestation_proof_digest="$(jq -er '.proofDigest | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/github-release-attestation-proof.json")"
            [[ "$recovery_control_proof_digest" =~ ^[0-9a-f]{64}$ ]]
            production_authorization_mode=immutable-product-recovery-control
            production_authorization_proof_digest="$recovery_control_proof_digest"
            recovery_control_json="$(jq -cn --arg proofDigest "$recovery_control_proof_digest" '{proofDigest:$proofDigest}')"
            immutable_tag_proof_digest_json="$(jq -cn --arg value "$immutable_tag_proof_digest" '$value')"
            release_attestation_proof_digest_json="$(jq -cn --arg value "$release_attestation_proof_digest" '$value')"
            repository_immutable_release_setting_verification=not_authorized_by_github_token
            production_static_network_json=null
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test -z "$recovery_control_proof_digest"
            test "$PRODUCT_COMMIT" = "$GITHUB_SHA"
            test "$CONTROL_COMMIT" = "$GITHUB_SHA"
            test "${{ needs.staged_deploy.outputs.deployment_id }}" = "${{ needs.runtime_gates.outputs.deployment_id }}"
            production_authorization_mode=github-actions-main-sha
            production_authorization_proof_digest="$production_authority_proof_digest"
            recovery_control_json=null
            immutable_tag_proof_digest_json=null
            release_attestation_proof_digest_json=null
            repository_immutable_release_setting_verification=not_required_for_normal_main
            production_static_manifest_digest="${{ needs.staged_deploy.outputs.production_static_manifest_digest }}"
            production_static_manifest_file_digest="${{ needs.staged_deploy.outputs.production_static_manifest_file_digest }}"
            production_static_asset_domain_digest="${{ needs.staged_deploy.outputs.production_static_asset_domain_digest }}"
            production_static_artifact_id="${{ needs.staged_deploy.outputs.production_static_artifact_id }}"
            production_static_artifact_digest="${{ needs.staged_deploy.outputs.production_static_artifact_digest }}"
            [[ "$production_static_manifest_digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$production_static_manifest_file_digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$production_static_asset_domain_digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$production_static_artifact_id" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$production_static_artifact_digest" =~ ^[0-9a-f]{64}$ ]]
            production_static_network_json="$(jq -cn \
              --arg schemaVersion 'p24b-rc6.4-formal-production-static-network-manifest-v1' \
              --arg assetDomain 'p24b-rc6.4-formal-production-static-network-assets-v1' \
              --arg environment production \
              --arg diagnosticsFlag '0' \
              --arg productCommit "$PRODUCT_COMMIT" \
              --arg productionOrigin "https://$PRIMARY_ALIAS" \
              --arg deploymentId "${{ needs.runtime_gates.outputs.deployment_id }}" \
              --arg manifestDigest "$production_static_manifest_digest" \
              --arg manifestFileDigest "$production_static_manifest_file_digest" \
              --arg assetDomainDigest "$production_static_asset_domain_digest" \
              --arg artifactId "$production_static_artifact_id" \
              --arg artifactDigest "$production_static_artifact_digest" \
              --arg artifactName "rc6-4-production-static-network-$PRODUCT_COMMIT-${{ needs.runtime_gates.outputs.deployment_id }}-$GITHUB_RUN_ID" \
              '{schemaVersion:$schemaVersion,assetDomain:$assetDomain,environment:$environment,diagnosticsFlag:$diagnosticsFlag,productCommit:$productCommit,productionOrigin:$productionOrigin,deploymentId:$deploymentId,manifestDigest:$manifestDigest,manifestFileDigest:$manifestFileDigest,assetDomainDigest:$assetDomainDigest,artifactId:$artifactId,artifactDigest:$artifactDigest,artifactName:$artifactName}')"
          fi
          jq -n \
            --arg schemaVersion 'p24b-rc6.5-new-luna-production-control-plane-evidence-v1' \
            --arg generatedAt "$generated_at" \
            --arg appCommit "$PRODUCT_COMMIT" \
            --arg releaseProductCommit "$PRODUCT_COMMIT" \
            --arg controlCommit "$CONTROL_COMMIT" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --arg workflowEvent "$GITHUB_EVENT_NAME" \
            --arg workflowRef "$GITHUB_REF" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg productionAuthorizationMode "$production_authorization_mode" \
            --arg productionAuthorizationProofDigest "$production_authorization_proof_digest" \
            --argjson recoveryControl "$recovery_control_json" \
            --argjson productionStaticNetwork "$production_static_network_json" \
            --arg deploymentId "${{ needs.runtime_gates.outputs.deployment_id }}" \
            --arg releaseLine "$EXPECTED_RELEASE_LINE" \
            --arg releaseTag "$EXPECTED_RELEASE_TAG" \
            --arg releaseRevision "$EXPECTED_RELEASE_REVISION" \
            --arg buildStartedAt "${{ needs.staged_deploy.outputs.build_started_at }}" \
            --arg buildCompletedAt "${{ needs.staged_deploy.outputs.build_completed_at }}" \
            --arg deployedAt "${{ needs.staged_deploy.outputs.deployed_at }}" \
            --arg archiveSha256 "${{ needs.staged_deploy.outputs.archive_sha256 }}" \
            --arg postBuildSecretScanReceiptDigest "${{ needs.staged_deploy.outputs.post_build_scan_receipt_digest }}" \
            --arg temporalProofDigest "${{ needs.runtime_gates.outputs.temporal_proof_digest }}" \
            --arg lastKnownGoodProvenanceDigest "$lkg_digest" \
            --arg priorLastKnownGoodArtifactProofDigest "$prior_lkg_proof_digest" \
            --arg priorLastKnownGoodArtifactId "$prior_lkg_artifact_id" \
            --arg priorLastKnownGoodRunId "$prior_lkg_run_id" \
            --arg priorLastKnownGoodHeadSha "$prior_lkg_head_sha" \
            --arg priorLastKnownGoodProductCommit "$prior_lkg_product_commit" \
            --arg priorLastKnownGoodControlCommit "$prior_lkg_control_commit" \
            --argjson immutableReleaseTagProofDigest "$immutable_tag_proof_digest_json" \
            --argjson githubReleaseAttestationProofDigest "$release_attestation_proof_digest_json" \
            --arg priorLastKnownGoodSelectionProofDigest "$lkg_selection_proof_digest" \
            --arg publicPostCutoverReceiptDigest "$public_post_cutover_receipt_digest" \
            --arg repositoryImmutableReleaseSettingVerification "$repository_immutable_release_setting_verification" \
            '{schemaVersion:$schemaVersion,status:"CONTROL_PLANE_PASS",generatedAt:$generatedAt,appCommit:$appCommit,releaseProductCommit:$releaseProductCommit,controlCommit:$controlCommit,workflowSha:$workflowSha,workflowEvent:$workflowEvent,workflowRef:$workflowRef,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,productionAuthorizationMode:$productionAuthorizationMode,productionAuthorizationProofDigest:$productionAuthorizationProofDigest,recoveryControl:$recoveryControl,productionStaticNetwork:$productionStaticNetwork,deploymentId:$deploymentId,releaseLine:$releaseLine,releaseTag:$releaseTag,releaseRevision:$releaseRevision,legacyTagTruth:"RC6_LEGACY_TAG_WAS_MISSING",buildStartedAt:$buildStartedAt,buildCompletedAt:$buildCompletedAt,deployedAt:$deployedAt,archiveSha256:$archiveSha256,postBuildSecretScanReceiptDigest:$postBuildSecretScanReceiptDigest,temporalProofDigest:$temporalProofDigest,lastKnownGoodProvenanceDigest:$lastKnownGoodProvenanceDigest,priorLastKnownGoodArtifactProofDigest:$priorLastKnownGoodArtifactProofDigest,priorLastKnownGoodArtifactId:$priorLastKnownGoodArtifactId,priorLastKnownGoodRunId:$priorLastKnownGoodRunId,priorLastKnownGoodHeadSha:$priorLastKnownGoodHeadSha,priorLastKnownGoodProductCommit:$priorLastKnownGoodProductCommit,priorLastKnownGoodControlCommit:$priorLastKnownGoodControlCommit,immutableReleaseTagProofDigest:$immutableReleaseTagProofDigest,githubReleaseAttestationProofDigest:$githubReleaseAttestationProofDigest,priorLastKnownGoodSelectionProofDigest:$priorLastKnownGoodSelectionProofDigest,publicPostCutoverReceiptDigest:$publicPostCutoverReceiptDigest,repositoryImmutableReleaseSettingVerification:$repositoryImmutableReleaseSettingVerification,publicAliasGate:"PASS",freshProductionBrowserGateStatus:"pending_external_real_browser_gate",fullNewLunaHandoffStatus:"not_yet_produced",sanitized:true,rawSecretsIncluded:false}' \
            > "$RUNNER_TEMP/new-luna-production-control-plane-evidence.json"
          evidence_directory="$RUNNER_TEMP/new-luna-production-control-plane-evidence"
          test ! -e "$evidence_directory"
          mkdir "$evidence_directory"
          cp "$RUNNER_TEMP/new-luna-production-control-plane-evidence.json" "$evidence_directory/"
          cp "$RUNNER_TEMP/last-known-good-artifact-proof.json" "$evidence_directory/"
          cp "$RUNNER_TEMP/lkg-independent-selection-proof.json" "$evidence_directory/"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.operation }}" == deploy-immutable-product-recovery ]]; then
            cp "$RUNNER_TEMP/immutable-release-tag-proof.json" "$evidence_directory/"
            cp "$RUNNER_TEMP/github-release-attestation-proof.json" "$evidence_directory/"
          fi

      - name: Publish sanitized post-Production new-LUNA control-plane evidence
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          steps.post_cutover_evidence.outcome == 'success' &&
          steps.last_known_good_write.outcome == 'success' &&
          steps.last_known_good_publish.outcome == 'success' &&
          steps.new_luna_create.outcome == 'success'
        id: new_luna_publish
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-new-luna-control-plane-evidence-${{ env.PRODUCT_COMMIT }}-control-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/new-luna-production-control-plane-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Recheck main head after LKG and LUNA evidence publication
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success'
        id: main_head_completion
        continue-on-error: true
        env:
          EXPECTED_MAIN_HEAD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-main-head-cas.mjs

      - name: Compensating rollback after post-cutover finalization failure
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          (steps.post_cutover_evidence.outcome != 'success' ||
          steps.last_known_good_write.outcome != 'success' ||
          steps.last_known_good_publish.outcome != 'success' ||
          steps.new_luna_create.outcome != 'success' ||
          steps.new_luna_publish.outcome != 'success' ||
          steps.main_head_completion.outcome != 'success')
        id: finalization_rollback
        continue-on-error: true
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

      - name: Fail after atomic cutover compensation
        if: always() && steps.cutover.outcome != 'success'
        run: |
          echo "Alias cutover failed; its atomic compensation completed or reported failure." >&2
          exit 1

      - name: Fail after post-cutover compensating rollback
        if: always() && steps.cutover.outcome == 'success' && steps.public_gate.outcome != 'success'
        run: |
          echo "Public Production verification failed and both aliases were rolled back." >&2
          exit 1

      - name: Fail after immutable Release compensating rollback
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'deploy-immutable-product-recovery' &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          steps.immutable_tag_final.outcome != 'success'
        run: |
          echo "Immutable GitHub Release verification failed and both aliases were rolled back." >&2
          exit 1

      - name: Fail after main-head CAS compensating rollback
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome != 'success'
        run: |
          echo "Remote main advanced during Production cutover and both aliases were rolled back." >&2
          exit 1


      - name: Fail after post-cutover finalization reconciliation
        if: >-
          always() &&
          steps.cutover.outcome == 'success' &&
          steps.public_gate.outcome == 'success' &&
          (github.event_name == 'push' || steps.immutable_tag_final.outcome == 'success') &&
          steps.main_head_final.outcome == 'success' &&
          (steps.post_cutover_evidence.outcome != 'success' ||
          steps.last_known_good_write.outcome != 'success' ||
          steps.last_known_good_publish.outcome != 'success' ||
          steps.new_luna_create.outcome != 'success' ||
          steps.new_luna_publish.outcome != 'success' ||
          steps.main_head_completion.outcome != 'success')
        run: |
          echo "Post-cutover finalization failed; compensating rollback was attempted and this run is failed closed." >&2
          exit 1

  alias_cutover_rollback_guard:
    name: independent alias rollback guard
    needs: [alias_cutover]
    if: >-
      always() &&
      (needs.alias_cutover.result == 'failure' || needs.alias_cutover.result == 'cancelled') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_FETCH_TIMEOUT_MS: 10000
      ROLLBACK_TARGET_SELECTION_DEADLINE_MS: 60000
      ROLLBACK_DEADLINE_MS: 240000
    steps:
      - name: Checkout trusted rollback control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Discover latest successful Last Known Good for rollback guard
        id: guard_lkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: node scripts/production-last-known-good.mjs discover

      - name: Require a verified Last Known Good rollback target
        shell: bash
        env:
          LKG_PUBLICATION_MODE: ${{ steps.guard_lkg.outputs.publication_mode }}
          LKG_SEED_ELIGIBLE: ${{ steps.guard_lkg.outputs.seed_eligible }}
          LKG_ARTIFACT_NAME: ${{ steps.guard_lkg.outputs.artifact_name }}
          LKG_PRODUCT_COMMIT: ${{ steps.guard_lkg.outputs.product_commit }}
          LKG_CONTROL_COMMIT: ${{ steps.guard_lkg.outputs.control_commit }}
        run: |
          set -euo pipefail
          test "${{ steps.guard_lkg.outputs.available }}" = true
          case "$LKG_PUBLICATION_MODE:$LKG_SEED_ELIGIBLE" in
            same-sha:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-${LKG_PRODUCT_COMMIT}"
              ;;
            immutable-product-control:false)
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-control-${LKG_CONTROL_COMMIT}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            repository-migration-seed:true)
              test "$GITHUB_EVENT_NAME" = push
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_REPOSITORY" = brendonlee1006/novel
              test "$GITHUB_REPOSITORY_ID" = 1357493987
              test "$LKG_ARTIFACT_NAME" = "production-last-known-good-migration-control-${LKG_CONTROL_COMMIT}-consumer-${GITHUB_RUN_ID}-product-${LKG_PRODUCT_COMMIT}"
              ;;
            *)
              echo "Refusing Last Known Good with an unsupported publication-mode/seed-eligibility pair." >&2
              exit 1
              ;;
          esac

      - name: Download verified Last Known Good for rollback guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ALLOW_REPOSITORY_MIGRATION_SEED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          LAST_KNOWN_GOOD_ARTIFACT_ID: ${{ steps.guard_lkg.outputs.artifact_id }}
          LAST_KNOWN_GOOD_ARTIFACT_NAME: ${{ steps.guard_lkg.outputs.artifact_name }}
          LAST_KNOWN_GOOD_ARTIFACT_DIGEST: ${{ steps.guard_lkg.outputs.artifact_digest }}
          LAST_KNOWN_GOOD_RUN_ID: ${{ steps.guard_lkg.outputs.run_id }}
          LAST_KNOWN_GOOD_HEAD_SHA: ${{ steps.guard_lkg.outputs.head_sha }}
          LAST_KNOWN_GOOD_PRODUCT_COMMIT: ${{ steps.guard_lkg.outputs.product_commit }}
          LAST_KNOWN_GOOD_CONTROL_COMMIT: ${{ steps.guard_lkg.outputs.control_commit }}
          LAST_KNOWN_GOOD_WORKFLOW_EVENT: ${{ steps.guard_lkg.outputs.workflow_event }}
          LAST_KNOWN_GOOD_WORKFLOW_BRANCH: ${{ steps.guard_lkg.outputs.workflow_branch }}
          LAST_KNOWN_GOOD_RUN_ATTEMPT: ${{ steps.guard_lkg.outputs.run_attempt }}
          LAST_KNOWN_GOOD_WORKFLOW_PATH: ${{ steps.guard_lkg.outputs.workflow_path }}
          LAST_KNOWN_GOOD_CREATED_AT: ${{ steps.guard_lkg.outputs.created_at }}
          LAST_KNOWN_GOOD_PUBLICATION_MODE: ${{ steps.guard_lkg.outputs.publication_mode }}
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/guard-last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/guard-last-known-good-artifact-proof.json
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/production-last-known-good.mjs download

      - name: Select independently verified rollback target
        id: guard_rollback
        env:
          DISABLE_CURRENT_CAPTURE: 'true'
          LAST_KNOWN_GOOD_AVAILABLE: 'true'
          LAST_KNOWN_GOOD_PATH: ${{ runner.temp }}/guard-last-known-good-production.json
          LAST_KNOWN_GOOD_PROOF_PATH: ${{ runner.temp }}/guard-last-known-good-artifact-proof.json
        run: node scripts/production-last-known-good.mjs select

      - name: Restore both aliases after cutover job failure or timeout
        env:
          PRIMARY_BEFORE_DEPLOYMENT: ${{ steps.guard_rollback.outputs.primary_deployment_id }}
          PRIMARY_BEFORE_COMMIT: ${{ steps.guard_rollback.outputs.primary_app_commit }}
          MIRROR_BEFORE_DEPLOYMENT: ${{ steps.guard_rollback.outputs.mirror_deployment_id }}
          MIRROR_BEFORE_COMMIT: ${{ steps.guard_rollback.outputs.mirror_app_commit }}
        run: node scripts/vercel-dual-alias-cutover.mjs restore

  main_push_complete:
    name: normal main push Production closure
    needs:
      - validate
      - audit_last_known_good
      - production_env_audit
      - production_env_repair
      - production_build
      - post_build_secret_scan
      - staged_deploy
      - runtime_gates
      - alias_cutover
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete non-skipped normal main Production DAG
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LKG_AUDIT_RESULT: ${{ needs.audit_last_known_good.result }}
          ENV_AUDIT_RESULT: ${{ needs.production_env_audit.result }}
          ENV_REPAIR_RESULT: ${{ needs.production_env_repair.result }}
          BUILD_RESULT: ${{ needs.production_build.result }}
          POST_BUILD_SCAN_RESULT: ${{ needs.post_build_secret_scan.result }}
          STAGED_DEPLOY_RESULT: ${{ needs.staged_deploy.result }}
          RUNTIME_GATES_RESULT: ${{ needs.runtime_gates.result }}
          ALIAS_CUTOVER_RESULT: ${{ needs.alias_cutover.result }}
          VALIDATED_RELEASE_LINE: ${{ needs.validate.outputs.release_line }}
          VALIDATED_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          VALIDATED_RELEASE_REVISION: ${{ needs.validate.outputs.release_revision }}
          VALIDATED_RELEASE_PROVENANCE_HASH: ${{ needs.validate.outputs.provenance_hash }}
          PRODUCTION_DEPLOY_COMMAND_COUNT: ${{ needs.staged_deploy.outputs.production_deploy_command_count }}
          PRODUCTION_DEPLOYMENT_AUTHORITY: ${{ needs.staged_deploy.outputs.production_deployment_authority }}
          PRODUCTION_DEPLOYMENT_MATCH_COUNT: ${{ needs.staged_deploy.outputs.production_deployment_match_count }}
          DUPLICATE_PRODUCTION_DEPLOY_COUNT: ${{ needs.staged_deploy.outputs.duplicate_production_deploy_count }}
          PRODUCTION_AUTHORITY_RECEIPT_DIGEST: ${{ needs.staged_deploy.outputs.production_authority_receipt_digest }}
        run: |
          set -euo pipefail
          test "$PRODUCT_COMMIT" = "$GITHUB_SHA"
          test "$CONTROL_COMMIT" = "$GITHUB_SHA"
          test "$VERCEL_GIT_COMMIT_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          results=(
            "$VALIDATE_RESULT" "$LKG_AUDIT_RESULT" "$ENV_AUDIT_RESULT"
            "$ENV_REPAIR_RESULT" "$BUILD_RESULT" "$POST_BUILD_SCAN_RESULT"
            "$STAGED_DEPLOY_RESULT" "$RUNTIME_GATES_RESULT" "$ALIAS_CUTOVER_RESULT"
          )
          skipped_count=0
          for result in "${results[@]}"; do
            if [[ "$result" == skipped ]]; then
              skipped_count=$((skipped_count + 1))
            fi
          done
          test "$skipped_count" = 0
          for result in "${results[@]}"; do
            test "$result" = success
          done
          [[ "$VALIDATED_RELEASE_LINE" =~ ^novel-ai-(p21|p23|p24a|p24b)-[a-z0-9-]+$ ]]
          [[ "$VALIDATED_RELEASE_TAG" =~ ^novel-ai-(p21|p23|p24a|p24b)-[a-z0-9-]+([.][0-9]+)?$ ]]
          [[ "$VALIDATED_RELEASE_REVISION" =~ ^rc[0-9]+([.][0-9]+)*$ ]]
          [[ "$VALIDATED_RELEASE_PROVENANCE_HASH" =~ ^[a-f0-9]{64}$ ]]
          test "$PRODUCTION_DEPLOY_COMMAND_COUNT" = 1
          test "$PRODUCTION_DEPLOYMENT_AUTHORITY" = github-actions
          test "$PRODUCTION_DEPLOYMENT_MATCH_COUNT" = 1
          test "$DUPLICATE_PRODUCTION_DEPLOY_COUNT" = 0
          [[ "$PRODUCTION_AUTHORITY_RECEIPT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo "MAIN_PUSH_AUTO_DEPLOYMENT_VERIFIED"

  recovery_complete:
    name: immutable Product recovery reconciliation
    needs:
      - validate
      - audit_last_known_good
      - production_env_audit
      - production_env_repair
      - production_build
      - post_build_secret_scan
      - staged_deploy
      - runtime_gates
      - alias_cutover
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha == '9cd074f239b73dd9b61f6d758fcf97fbd809face' && inputs.operation == 'deploy-immutable-product-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete dual-SHA Production closure
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LKG_AUDIT_RESULT: ${{ needs.audit_last_known_good.result }}
          ENV_AUDIT_RESULT: ${{ needs.production_env_audit.result }}
          ENV_REPAIR_RESULT: ${{ needs.production_env_repair.result }}
          BUILD_RESULT: ${{ needs.production_build.result }}
          POST_BUILD_SCAN_RESULT: ${{ needs.post_build_secret_scan.result }}
          STAGED_DEPLOY_RESULT: ${{ needs.staged_deploy.result }}
          RUNTIME_GATES_RESULT: ${{ needs.runtime_gates.result }}
          ALIAS_CUTOVER_RESULT: ${{ needs.alias_cutover.result }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT_COMMIT" == "$RECOVERY_PRODUCT_COMMIT" ]]
          [[ "$CONTROL_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$CONTROL_COMMIT" ]]
          for result in \
            "$VALIDATE_RESULT" "$LKG_AUDIT_RESULT" "$ENV_AUDIT_RESULT" \
            "$ENV_REPAIR_RESULT" "$BUILD_RESULT" "$POST_BUILD_SCAN_RESULT" \
            "$STAGED_DEPLOY_RESULT" "$RUNTIME_GATES_RESULT" "$ALIAS_CUTOVER_RESULT"; do
            [[ "$result" == "success" ]]
          done
          echo "PASS"
